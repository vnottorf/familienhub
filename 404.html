function saveCloud(){localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud))}
function authHeaders(extra={}){
  const token=cloud.accessToken||cloud.anonKey;
  return {apikey:cloud.anonKey,Authorization:"Bearer "+token,"Content-Type":"application/json",...extra};
}

let sessionRefreshPromise=null;

function jwtExpMs(token){
  try{
    const p=token.split(".")[1];
    if(!p)return 0;
    const b64=p.replace(/-/g,"+").replace(/_/g,"/");
    const json=JSON.parse(atob(b64.padEnd(Math.ceil(b64.length/4)*4,"=")));
    return Number(json.exp||0)*1000;
  }catch{return 0}
}

function clearExpiredSession(){
  cloud.accessToken="";
  cloud.refreshToken="";
  cloud.userId="";
  cloud.enabled=false;
  saveCloud();
}

async function refreshCloudSession(){
  if(sessionRefreshPromise)return sessionRefreshPromise;
  sessionRefreshPromise=(async()=>{
    if(!cloud.url||!cloud.anonKey)throw new Error("Supabase-Verbindung fehlt.");
    if(!cloud.refreshToken){
      clearExpiredSession();
      throw new Error("Sitzung abgelaufen – bitte einmal neu anmelden.");
    }
    const r=await fetch(cloud.url.replace(/\/$/,"")+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST",
      headers:{apikey:cloud.anonKey,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:cloud.refreshToken})
    });
    const text=await r.text();
    let d={};try{d=text?JSON.parse(text):{}}catch{}
    if(!r.ok||!d.access_token){
      clearExpiredSession();
      throw new Error((d&&((d.error_description)||(d.msg)||(d.message)))||"Sitzung abgelaufen – bitte neu anmelden.");
    }
    cloud.accessToken=d.access_token;
    cloud.refreshToken=d.refresh_token||cloud.refreshToken;
    cloud.userId=d.user?.id||cloud.userId;
    cloud.enabled=true;
    saveCloud();
    return true;
  })();
  try{return await sessionRefreshPromise}
  finally{sessionRefreshPromise=null}
}

async function ensureFreshSession(force=false){
  if(!cloud.accessToken)return false;
  const exp=jwtExpMs(cloud.accessToken);
  // Supabase access tokens are short-lived. Renew about one minute before expiry.
  if(force||(exp&&exp-Date.now()<60000))await refreshCloudSession();
  return !!cloud.accessToken;
}

async function api(path,opts={}){
  if(!cloud.url) throw new Error("Supabase-URL fehlt.");
  if(cloud.accessToken)await ensureFreshSession(false);

  const doFetch=()=>fetch(cloud.url.replace(/\/$/,"")+path,{
    ...opts,
    headers:authHeaders(opts.headers||{})
  });

  let r=await doFetch();
  let text=await r.text();
  let data=null;try{data=text?JSON.parse(text):null}catch{data=text}

  // Token may have expired between checks or the server may reject it.
  if(r.status===401&&cloud.refreshToken){
    const msg=((data&&((data.msg)||(data.message)||(data.error_description)))||"").toLowerCase();
    if(msg.includes("jwt")||msg.includes("expired")||msg.includes("token")){
      await ensureFreshSession(true);
      r=await doFetch();
      text=await r.text();
      try{data=text?JSON.parse(text):null}catch{data=text}
    }
  }

  if(!r.ok)throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||("HTTP "+r.status));
  return data;
}

const MEDIA_BUCKET="familienhub-media";
const mediaObjectUrls=new Map();

function safeFileName(name){
  return String(name||"datei")
    .normalize("NFKD").replace(/[^\w.\-]+/g,"-")
    .replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,80)||"datei";
}
function mediaExt(file){
  const n=file.name||"",m=n.match(/\.([a-zA-Z0-9]{1,6})$/);
  if(m)return m[1].toLowerCase();
  if(file.type==="image/jpeg")return "jpg";
  if(file.type==="image/png")return "png";
  if(file.type==="image/webp")return "webp";
  if(file.type==="application/pdf")return "pdf";
  return "bin";
}
async function prepareMediaFile(file){
  if(!file)return null;
  if(file.type==="application/pdf"){
    if(file.size>5*1024*1024)throw new Error(`${file.name}: PDF ist größer als 5 MB.`);
    return {blob:file,type:file.type,name:file.name,ext:"pdf"};
  }
  if(!file.type.startsWith("image/"))throw new Error(`${file.name}: Nur Bilder und PDF werden unterstützt.`);
  const data=await new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
  });
  const img=await new Promise((resolve,reject)=>{
    const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data;
  });
  const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
  canvas.getContext("2d").drawImage(img,0,0,w,h);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.82));
  if(!blob)throw new Error(`${file.name}: Bild konnte nicht verarbeitet werden.`);
  return {blob,type:"image/jpeg",name:file.name.replace(/\.[^.]+$/,"")+".jpg",ext:"jpg"};
}
async function uploadNoteFiles(noteId,files){
  const list=[...(files||[])].slice(0,4);
  if(!list.length)return [];
  if(!cloud.enabled||!cloud.familyId||!cloud.accessToken)
    throw new Error("Bilder/Anhänge benötigen die Familien-Synchronisierung mit Supabase.");
  await ensureFreshSession(false);
  const uploaded=[];
  for(const original of list){
    const p=await prepareMediaFile(original);
    const objectId=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));
    const path=`${cloud.familyId}/${noteId}/${objectId}.${p.ext}`;
    const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+MEDIA_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/");
    const r=await fetch(url,{
      method:"POST",
      headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken,"Content-Type":p.type,"x-upsert":"false"},
      body:p.blob
    });
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.message||d.error||`${original.name}: Upload fehlgeschlagen (${r.status})`);
    uploaded.push({id:objectId,name:safeFileName(p.name),type:p.type,path,size:p.blob.size});
  }
  return uploaded;
}
async function fetchAttachmentBlob(att){
  const key=att.path;
  if(mediaObjectUrls.has(key))return mediaObjectUrls.get(key);
  if(!cloud.accessToken)throw new Error("Bitte anmelden, um den Anhang zu öffnen.");
  await ensureFreshSession(false);
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/authenticated/"+MEDIA_BUCKET+"/"+att.path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  if(!r.ok){let d={};try{d=await r.json()}catch{};throw new Error(d.message||`Anhang konnte nicht geladen werden (${r.status})`)}
  const blob=await r.blob(),obj=URL.createObjectURL(blob);
  mediaObjectUrls.set(key,obj);
  return obj;
}

    // Später können wir hier einen Familien-Wechsler ergänzen.
    const f=rows[0];
    cloud.familyId=f.family_id;
    cloud.familyName=f.family_name;
    cloud.inviteCode=f.invite_code;
    cloud.displayName=f.display_name;
    cloud.enabled=true;
    saveCloud();
    return true;
  }catch(e){
    console.warn("Familie automatisch finden:",e);
    setCloudStatus("Familie konnte nicht automatisch geladen werden: "+e.message,false);
    return false;
  }
}

async function bootstrapCloud(){

const PARENT_PRIVATE_COLLECTIONS=["gifts","renovationRooms","renovationTasks","renovationMaterials","renovationContractors","renovationOffers","renovationDecisions"];
function syncCollectionsForCurrentRole(){
  return SYNC_COLLECTIONS.filter(c=>!PARENT_PRIVATE_COLLECTIONS.includes(c)||canManageFamily());
}
function sanitizeParentPrivateData(){
  if(canManageFamily())return;
  let changed=false;
  for(const c of PARENT_PRIVATE_COLLECTIONS){
    if(Array.isArray(db[c])&&db[c].length){db[c]=[];changed=true}
  }
  if(changed)localStorage.setItem(KEY,JSON.stringify(db));
}

function cleanSyncItem(collection,item){
  const c=structuredClone(item);delete c._cloudUpdatedAt;
  if(collection==="wishes"){c.reserved=false;c.reservedBy=null}
  return c;
}
function syncSnapshot(){
  const snap={};
  for(const c of syncCollectionsForCurrentRole()){snap[c]={};for(const item of (db[c]||[])){if(item?.id)snap[c][String(item.id)]=JSON.stringify(cleanSyncItem(c,item))}}
  return snap;
}
function buildAllRecordRows(){
  const rows=[];for(const c of syncCollectionsForCurrentRole())for(const item of (db[c]||[]))if(item?.id)rows.push({family_id:cloud.familyId,collection:c,record_id:String(item.id),data:cleanSyncItem(c,item),deleted:false});
  return rows;
}
function changedRecordRows(){
  if(!lastSyncSnapshot)return buildAllRecordRows();
  const now=syncSnapshot(),rows=[];
  for(const c of syncCollectionsForCurrentRole()){
    const prev=lastSyncSnapshot[c]||{},cur=now[c]||{};
    for(const [id,j] of Object.entries(cur))if(prev[id]!==j)rows.push({family_id:cloud.familyId,collection:c,record_id:id,data:JSON.parse(j),deleted:false});
    for(const id of Object.keys(prev))if(!(id in cur))rows.push({family_id:cloud.familyId,collection:c,record_id:id,data:{},deleted:true});
  }
  return rows;
}
async function postRecordRows(rows){
  if(!rows.length)return;
  await api("/rest/v1/family_records?on_conflict=family_id,collection,record_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
}
function applyRemoteRows(rows){
  sanitizeParentPrivateData();
  for(const c of syncCollectionsForCurrentRole()){
    const relevant=rows.filter(r=>r.collection===c);if(!relevant.length)continue;
    const byId=new Map(relevant.map(r=>[String(r.record_id),r])),merged=[];
    for(const local of (db[c]||[])){const r=byId.get(String(local.id));if(!r)continue;if(!r.deleted)merged.push(r.data);byId.delete(String(local.id))}
    for(const r of byId.values())if(!r.deleted)merged.push(r.data);
    db[c]=merged;
  }
  localStorage.setItem(KEY,JSON.stringify(db));
}
async function migrateLegacyStateIfNeeded(){
  const existing=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=record_id&limit=1`);if(existing?.length)return;
  const legacy=await api(`/rest/v1/family_state?family_id=eq.${cloud.familyId}&select=data`);
  if(legacy?.length&&legacy[0].data&&Object.keys(legacy[0].data).length){
    db={...db,...legacy[0].data};localStorage.setItem(KEY,JSON.stringify(db));
    if(canEditGeneral())await postRecordRows(buildAllRecordRows());
  }else if(canManageFamily())await postRecordRows(buildAllRecordRows());
}
async function initializeRecordSync(){
  if(!cloud.enabled||!cloud.familyId||!cloud.accessToken)return;
  try{
    await migrateLegacyStateIfNeeded();
    const rows=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=collection,record_id,data,updated_at,deleted&order=updated_at.asc`);
    if(rows?.length)applyRemoteRows(rows);
    lastSyncSnapshot=syncSnapshot();cloud.lastSync=new Date().toISOString();saveCloud();setCloudStatus("Synchronisiert · Einzel-Einträge",true);
  }catch(e){setCloudStatus("Sync-Setup: "+e.message,false)}
}
async function recordPushInternal(){const rows=changedRecordRows();if(rows.length){await postRecordRows(rows);lastSyncSnapshot=syncSnapshot()}}
async function recordPullInternal(){
  const rows=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=collection,record_id,data,updated_at,deleted&order=updated_at.asc`);
  if(rows?.length)applyRemoteRows(rows);lastSyncSnapshot=syncSnapshot();await loadReservations();
}
async function cloudSyncCycle(silent=false){
  if(syncBusy||!cloud.enabled||!cloud.familyId||!cloud.accessToken)return;syncBusy=true;
  try{await recordPushInternal();await recordPullInternal();cloud.lastSync=new Date().toISOString();saveCloud();setCloudStatus("Synchronisiert · Einzel-Einträge",true);if(!silent)render()}
  catch(e){
    const expired=/sitzung abgelaufen|jwt expired|refresh token|invalid refresh/i.test(e.message||"");
    setCloudStatus((expired?"Anmeldung erforderlich: ":"Sync-Fehler: ")+e.message,false);
    if(!silent)alert((expired?"Bitte einmal neu anmelden: ":"Synchronisierung fehlgeschlagen: ")+e.message);
  }
  finally{syncBusy=false}
}
async function cloudPush(){return cloudSyncCycle(false)}
async function cloudPull(silent=false){return cloudSyncCycle(silent)}
function scheduleCloudPush(){if(!cloud.enabled||!cloud.familyId)return;clearTimeout(cloudPushTimer);cloudPushTimer=setTimeout(()=>cloudSyncCycle(true),700)}
function startCloudPolling(){if(cloudPollingStarted)return;cloudPollingStarted=true;setInterval(()=>{if(cloud.enabled&&cloud.familyId)cloudSyncCycle(true).then(()=>{if(!state.modal&&!["cloud","roles"].includes(state.view))render()})},6000)}

const AUTO_BACKUP_KEY="familienhub-v10-restore-points";
function autoBackupSnapshot(){
  const snap=structuredClone(db);
  // Restore points should remain compact and should not duplicate secrets/photos.
  for(const p of (snap.family||[]))p.photo="";
  if(snap.ha)snap.ha={...snap.ha,token:""};
  for(const c of PARENT_PRIVATE_COLLECTIONS)delete snap[c];
  return snap;
}
function restorePoints(){
  try{return JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||"[]")}catch{return []}
}
function createRestorePoint(reason="auto",force=false){
  try{
    const points=restorePoints();
    const last=points[0]?.at?new Date(points[0].at).getTime():0;
    if(!force&&Date.now()-last<6*3600000)return;
    points.unshift({at:new Date().toISOString(),reason,data:JSON.stringify(autoBackupSnapshot())});
    localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(points.slice(0,5)));
  }catch(e){console.warn("Wiederherstellungspunkt:",e)}
}
function restoreLocalPoint(index){
  const p=restorePoints()[index];if(!p)return;
  if(!confirm(`Stand vom ${new Date(p.at).toLocaleString("de-DE")} wiederherstellen?`))return;
  try{
    const restored=JSON.parse(p.data);
    const currentPhotos=new Map((db.family||[]).map(x=>[x.id,x.photo]));
    for(const x of (restored.family||[]))if(currentPhotos.has(x.id))x.photo=currentPhotos.get(x.id)||"";
    if(restored.ha&&db.ha?.token)restored.ha.token=db.ha.token;
    db=restored;
    localStorage.setItem(KEY,JSON.stringify(db));
    scheduleCloudPush();
    render();
    alert("Wiederherstellungspunkt geladen.");
  }catch(e){alert("Wiederherstellung fehlgeschlagen: "+e.message)}
}
function deleteRestorePoints(){
  if(confirm("Alle lokalen Wiederherstellungspunkte löschen?")){
    localStorage.removeItem(AUTO_BACKUP_KEY);render();
  }
}

function searchNorm(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ß/g,"ss").replace(/[^\p{L}\p{N}@]+/gu," ").trim();
}

function searchMatches(hay,needle){

  return tokens.length&&tokens.every(t=>h.includes(t));
}

    out.push({kind:"note",id:n.id,icon:"📌",title:n.title||"Pinnwand",meta:`Pinnwand · ${n.category||"Allgemein"}`});
  for(const m of db.meals)if(searchMatches(searchHay(m.title,m.day,(m.ingredients||[]).join(" ")),needle))
    out.push({kind:"meal",id:m.id,icon:"🍲",title:m.title,meta:`Essensplan · ${m.day}`});
  for(const o of db.occasions)if(searchMatches(searchHay(o.title,o.kind,o.date),needle))
    out.push({kind:"occasion",id:o.id,icon:"🎉",title:o.title,meta:`${o.kind||"Anlass"} · ${fmtDate(o.date)}`});
  for(const i of db.inbox)if(searchMatches(searchHay(i.text,i.author),needle))
    out.push({kind:"inbox",id:i.id,icon:"📥",title:i.text,meta:`Inbox · ${i.author}`});
  for(const w of db.wishes)if(searchMatches(searchHay(w.title,w.person,w.note,w.url),needle))
    out.push({kind:"wish",id:w.id,icon:"🎁",title:w.title,meta:`Wunsch · ${w.person}`});

function closeOtherSwipeRows(except){
  document.querySelectorAll(".swipe-item.swipe-open,.swipe-item.swipe-action-open").forEach(el=>{
    if(el!==except){
      el.classList.remove("swipe-open","swipe-action-open");
      const c=el.querySelector(".swipe-content");
      if(c)c.style.transform="";
    }
  });
}
function initSwipeRows(){
  document.querySelectorAll(".swipe-item").forEach(item=>{
    const content=item.querySelector(".swipe-content");
    if(!content||item.dataset.swipeReady)return;
    item.dataset.swipeReady="1";
    let startX=0,startY=0,dx=0,active=false,horizontal=false;

    content.addEventListener("touchstart",e=>{
      if(e.touches.length!==1)return;
      closeOtherSwipeRows(item);
      const t=e.touches[0];
      startX=t.clientX;startY=t.clientY;dx=0;active=true;horizontal=false;
      content.style.transition="none";
    },{passive:true});

    content.addEventListener("touchmove",e=>{
      if(!active||e.touches.length!==1)return;
      const t=e.touches[0];
      const x=t.clientX-startX,y=t.clientY-startY;
      if(!horizontal&&Math.abs(x)>8){
        if(Math.abs(x)>Math.abs(y)*1.15)horizontal=true;
        else if(Math.abs(y)>Math.abs(x)){active=false;content.style.transition="";return}
      }
      if(!horizontal)return;
      e.preventDefault();
      dx=x;
      const openDelete=item.classList.contains("swipe-open");
      const openQuick=item.classList.contains("swipe-action-open");
      const base=openDelete?-92:openQuick?92:0;
      const maxRight=item.dataset.hasQuick==="1"?108:10;
      const pos=Math.max(-108,Math.min(maxRight,base+dx));
      content.style.transform=`translateX(${pos}px)`;
    },{passive:false});

    content.addEventListener("touchend",()=>{
      content.style.transition="";
      if(horizontal){
        swipeClickBlockedUntil=Date.now()+350;
        const wasDelete=item.classList.contains("swipe-open");
        const wasQuick=item.classList.contains("swipe-action-open");
        item.classList.remove("swipe-open","swipe-action-open");

        let next="closed";
        if(!wasDelete&&!wasQuick){
          if(dx<-38)next="delete";
          else if(dx>38&&item.dataset.hasQuick==="1")next="quick";
        }else if(wasDelete){
          if(dx<28)next="delete";
          if(dx>45&&item.dataset.hasQuick==="1")next="quick";
        }else if(wasQuick){
          if(dx>-28)next="quick";
          if(dx<-45)next="delete";
        }

        if(next==="delete"){
          item.classList.add("swipe-open");
          content.style.transform="translateX(-92px)";
        }else if(next==="quick"){
          item.classList.add("swipe-action-open");
          content.style.transform="translateX(92px)";
        }else{
          content.style.transform="";
        }
      }
      active=false;horizontal=false;dx=0;
    },{passive:true});
  });
}

async function finalizeUndoDelete(){
  const u=state.undoDelete;
  if(!u)return;
  clearTimeout(undoDeleteTimer);undoDeleteTimer=null;
  if(u.type==="note"){
    for(const a of (u.item.attachments||[])){
      try{await deleteStorageObject(a.path)}catch(e){console.warn("Datei-Cleanup:",e)}
    }
  }
  const label=deleteLabel(u.type,u.item);
  addActivity("🗑️",`hat „${label}“ gelöscht.`,u.type,u.item.id);
  state.undoDelete=null;
  save();render();

}
function undoLastDelete(){
  const u=state.undoDelete;if(!u)return;
  clearTimeout(undoDeleteTimer);undoDeleteTimer=null;
  const arr=db[u.collection];
  if(Array.isArray(arr)&&!arr.some(x=>x.id===u.item.id)){
    arr.splice(Math.min(u.index,arr.length),0,u.item);
  }
  state.undoDelete=null;
  save();render();
}
async function swipeDelete(type,id){
  if(!requireGeneralEdit())return;
  const collection=deleteMap(type);if(!collection)return;
  const arr=db[collection],index=arr.findIndex(x=>x.id===id);if(index<0)return;
  if(state.undoDelete)await finalizeUndoDelete();
  const item=structuredClone(arr[index]);
  arr.splice(index,1);
  state.itemDetail=null;state.noteDetailId=null;
  state.undoDelete={type,collection,item,index};
  save();render();
  undoDeleteTimer=setTimeout(()=>finalizeUndoDelete(),8000);
}

function mealDayOffset(label){
  const raw=String(label||"").trim().toLowerCase();
  if(raw==="heute")return 0;
  if(raw==="morgen")return 1;
  if(raw==="übermorgen"||raw==="uebermorgen")return 2;

  const weekdayMap={
    "sonntag":0,"so":0,
    "montag":1,"mo":1,
    "dienstag":2,"di":2,
    "mittwoch":3,"mi":3,
    "donnerstag":4,"do":4,
    "freitag":5,"fr":5,
    "samstag":6,"sa":6
  };
  const target=weekdayMap[raw];
  if(target===undefined)return 999;
  const now=new Date();
  const current=now.getDay();
  let diff=(target-current+7)%7;
  // Wenn derselbe Wochentag ausgeschrieben ist, ist damit "heute" gemeint.
  return diff;
}
function sortedMeals(){
  return [...db.meals].sort((a,b)=>{
    const da=mealDayOffset(a.day),dbb=mealDayOffset(b.day);
    if(da!==dbb)return da-dbb;
    return String(a.title||"").localeCompare(String(b.title||""),"de");
  });
}

function daysUntil(date){
  if(!date)return 99999;
  const a=new Date(todayISO()+"T12:00"),b=new Date(date+"T12:00");
  return Math.round((b-a)/86400000);
}
function advanceDate(date,frequency,interval=1){
  const d=new Date((date||todayISO())+"T12:00"),n=Math.max(1,Number(interval)||1);
  if(frequency==="daily")d.setDate(d.getDate()+n);
  else if(frequency==="weekly")d.setDate(d.getDate()+7*n);
  else if(frequency==="monthly")d.setMonth(d.getMonth()+n);
  else if(frequency==="yearly")d.setFullYear(d.getFullYear()+n);
  return d.toISOString().slice(0,10);
}
function routineLabel(r){
  const unit={daily:"Tag",weekly:"Woche",monthly:"Monat",yearly:"Jahr"}[r.frequency]||"Intervall";
  const base=Number(r.interval||1)===1?`jede${unit==="Woche"?" ":"n "}${unit.toLowerCase()}`:`alle ${r.interval} ${unit}${unit==="Monat"?"e":unit==="Jahr"?"e":"n"}`;
  return base+(Array.isArray(r.rotation)&&r.rotation.length>1?` · Wechsel: ${r.rotation.join(" → ")}`:"");
}

function completeRoutine(id){
  if(!requireGeneralEdit())return;
  const r=db.routines.find(x=>x.id===id);if(!r)return;
  const oldWho=r.who;
  r.lastDone=new Date().toISOString();
  r.nextDate=advanceDate(r.nextDate||todayISO(),r.frequency,r.interval);
  if(Array.isArray(r.rotation)&&r.rotation.length>1){
    const current=Math.max(0,r.rotation.indexOf(r.who));
    const next=(current+1)%r.rotation.length;
    r.rotationIndex=next;
    r.who=r.rotation[next];
  }
  addActivity("🔁",`hat die Routine „${r.title}“ erledigt.${oldWho!==r.who?` Als Nächstes: ${r.who}.`:""}`,"routine",r.id);
  save();render();
}
function setRoutineActive(id,on){
  if(!requireGeneralEdit())return;
  const r=db.routines.find(x=>x.id===id);if(!r)return;
  r.active=on;save();render();
}
function schoolSorted(){
  return [...db.school].sort((a,b)=>(String(a.date)+String(a.time||"")).localeCompare(String(b.date)+String(b.time||"")));
}
function toggleSchool(id){
  if(!requireGeneralEdit())return;
  const s=db.school.find(x=>x.id===id);if(!s)return;
  s.done=!s.done;
  addActivity(s.done?"✅":"↩️",s.done?`hat „${s.title}“ in Schule erledigt.`:`hat „${s.title}“ wieder geöffnet.`,"school",s.id);
  save();render();
}
function pantryLevelLabel(l){return ({full:"Voll",ok:"Okay",low:"Knapp",empty:"Leer"}[l]||l)}
function setPantryLevel(id,level){
  if(!requireGeneralEdit())return;
  const p=db.pantry.find(x=>x.id===id);if(!p)return;
  p.level=level;p.updatedAt=new Date().toISOString();
  if(p.autoShop&&["low","empty"].includes(level)){pantryToShopping(id);return}
  save();render();
}
function pantryToShopping(id){
  if(!requireGeneralEdit())return;
  const p=db.pantry.find(x=>x.id===id);if(!p)return;
  const listId=state.shopList||db.shoppingLists[0]?.id;if(!listId)return alert("Bitte zuerst eine Einkaufsliste anlegen.");
  const exists=db.shopping.some(s=>s.listId===listId&&!s.done&&s.name.trim().toLowerCase()===p.name.trim().toLowerCase());
  if(!exists){
    const sid="s"+Date.now();
    db.shopping.push({id:sid,listId,name:p.name,qty:p.qty||"1×",cat:p.category||"Vorrat",by:currentDisplayName(),note:"Aus Vorräte",done:false,comments:[]});
    addActivity("🧺",`hat „${p.name}“ aus den Vorräten auf die Einkaufsliste gesetzt.`,"shop",sid);
  }
  p.level="ok";save();render();
}
function tripProgress(t){
  const total=(t.checklist||[]).length,done=(t.checklist||[]).filter(x=>x.done).length;
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function toggleTripCheck(tripId,itemId){
  if(!requireGeneralEdit())return;
  const t=db.trips.find(x=>x.id===tripId),i=t?.checklist?.find(x=>x.id===itemId);if(!i)return;
  i.done=!i.done;save();render();
}
function addTripCheck(tripId){
  if(!requireGeneralEdit())return;
  const text=prompt("Was soll auf die Reise-Checkliste?");if(!text?.trim())return;
  const t=db.trips.find(x=>x.id===tripId);if(!t)return;
  t.checklist.push({id:"tc"+Date.now(),text:text.trim(),done:false});
  save();render();
}
function createTripTasks(tripId){
  if(!requireGeneralEdit())return;
  const t=db.trips.find(x=>x.id===tripId);if(!t)return;
  const who=currentDisplayName(),due=t.startDate||todayISO();
  let n=0;
  for(const i of t.checklist.filter(x=>!x.done)){
    if(db.tasks.some(x=>!x.done&&x.title.toLowerCase()===i.text.toLowerCase()))continue;
    db.tasks.push({id:"t"+Date.now()+"-"+n++,title:i.text,due,time:"18:00",who,prio:"med",repeat:"none",remindMinutes:1440,note:`Reise: ${t.title}`,done:false,completedAt:null,comments:[]});
  }
  addActivity("🧳",`hat die offene Checkliste für „${t.title}“ in Aufgaben übernommen.`,"trip",t.id);
  save();render();
}

  return db.documents.filter(d=>d.expires&&daysUntil(d.expires)>=0&&daysUntil(d.expires)<=days).sort((a,b)=>a.expires.localeCompare(b.expires));
}
function smartSuggestions(){
  const out=[];
  if(cloud.enabled&&cloud.familyId&&cloud.lastSync&&Date.now()-new Date(cloud.lastSync).getTime()>5*60000)out.push({icon:"☁️",title:"Synchronisierung ist länger her",text:`Letzter Sync ${new Date(cloud.lastSync).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}`,action:`go('cloud')`,button:"Sync prüfen"});
  const dueNow=dueReminderItems().filter(r=>effectiveReminderTrigger(r)<=new Date()).length;
  if(dueNow)out.push({icon:"🔔",title:`${dueNow} Erinnerung${dueNow===1?" ist":"en sind"} jetzt fällig`,text:"Direkt öffnen, erledigen oder später erinnern lassen.",action:`go('reminders')`,button:"Erinnerungen"});
  const tomorrowCount=tomorrowPrepCount();
  if(tomorrowCount>=4)out.push({icon:"🌙",title:`Morgen stehen ${tomorrowCount} Punkte an`,text:"Ein kurzer Abend-Check kann morgen entspannter machen.",action:`go('prep')`,button:"Morgen vorbereiten"});
  const plannedMeals=sortedMeals().filter(m=>{const o=mealDayOffset(m.day);return o>=0&&o<=6}).length;
  if(plannedMeals<3)out.push({icon:"🍲",title:"Essensplan ist noch recht leer",text:`Für die nächsten 7 Tage sind ${plannedMeals} Gerichte geplant.`,action:`go('meals')`,button:"Essen planen"});
  if([0,6].includes(new Date().getDay()))out.push({icon:"🗓️",title:"Guter Moment für den Wochenblick",text:"Termine, Aufgaben, Schule und Essen einmal gemeinsam überfliegen.",action:`go('week')`,button:"Woche öffnen"});
  const overdue=sortedOpenTasks().filter(isTaskOverdue);
  if(overdue.length)out.push({icon:"⏰",title:`${overdue.length} Aufgabe${overdue.length===1?"":"n"} überfällig`,text:"Am besten kurz neu terminieren oder erledigen.",action:`go('tasks')`,button:"Aufgaben"});
  const dueR=sortedRoutines().filter(r=>daysUntil(r.nextDate)<=0);
  if(dueR.length)out.push({icon:"🔁",title:`${dueR.length} Routine${dueR.length===1?"":"n"} fällig`,text:dueR.slice(0,2).map(r=>r.title).join(" · "),action:`go('routines')`,button:"Routinen"});
  const low=db.pantry.filter(p=>["low","empty"].includes(p.level));
  if(low.length)out.push({icon:"🧺",title:`${low.length} Vorrat${low.length===1?" ist":"e sind"} knapp`,text:low.slice(0,3).map(p=>p.name).join(" · "),action:`go('pantry')`,button:"Vorräte"});
  const tomorrow=plusDays(1);
  const schoolTomorrow=db.school.filter(s=>!s.done&&s.date===tomorrow);
  if(schoolTomorrow.length)out.push({icon:"🎒",title:`Morgen ${schoolTomorrow.length} Schulpunkt${schoolTomorrow.length===1?"":"e"}`,text:schoolTomorrow.slice(0,3).map(s=>s.title).join(" · "),action:`go('school')`,button:"Schule"});
  const exp=expiringDocuments(60);
  if(exp.length)out.push({icon:"📂",title:`${exp.length} Dokument${exp.length===1?" läuft":"e laufen"} bald ab`,text:exp.slice(0,2).map(d=>`${d.title} (${fmtDate(d.expires)})`).join(" · "),action:`go('documents')`,button:"Dokumente"});
  const trips=db.trips.filter(t=>daysUntil(t.startDate)>=0&&daysUntil(t.startDate)<=7);
  if(trips.length)out.push({icon:"🧳",title:`Reise bald: ${trips[0].title}`,text:`Start ${fmtDate(trips[0].startDate)} · ${tripProgress(trips[0]).done}/${tripProgress(trips[0]).total} Checklistenpunkte erledigt`,action:`go('trips')`,button:"Reise"});
  for(const m of sortedMeals().slice(0,3)){
    const missing=(m.ingredients||[]).filter(ing=>!db.shopping.some(s=>!s.done&&s.name.toLowerCase()===String(ing).toLowerCase()));
    if(missing.length>=2){out.push({icon:"🍲",title:`Zutaten für „${m.title}“ fehlen noch`,text:missing.slice(0,4).join(" · "),action:`go('meals')`,button:"Essensplan"});break}
  }
  return out.slice(0,6);
}

function prepTomorrowData(){
  const date=plusDays(1);
  const people=db.family.map(p=>{
    const owner=p.id;
    const events=db.events.filter(e=>e.date===date&&(e.calendarOwner==="family"||e.calendarOwner===owner)).sort((a,b)=>String(a.time||"").localeCompare(String(b.time||"")));
    const tasks=sortedOpenTasks(db.tasks.filter(t=>t.due===date&&t.who===p.name));
    const school=db.school.filter(s=>!s.done&&s.date===date&&s.child===p.name).sort((a,b)=>String(a.time||"").localeCompare(String(b.time||"")));
    const routines=sortedRoutines().filter(r=>r.nextDate===date&&r.who===p.name);
    return {person:p,events,tasks,school,routines,total:events.length+tasks.length+school.length+routines.length};
  });
  const meals=sortedMeals().filter(m=>mealDayOffset(m.day)===1);
  const trip=[...db.trips].filter(t=>t.startDate===date)[0]||null;
  return {date,people,meals,trip};
}
function tomorrowPrepCount(){
  const d=prepTomorrowData();
  return d.people.reduce((n,p)=>n+p.total,0)+d.meals.length+(d.trip?1:0);
}

function weekLoad(){
  const result=db.family.map(p=>({name:p.name,count:0,events:0,tasks:0,school:0,routines:0}));
  const byName=n=>result.find(x=>x.name===n);
  const end=plusDays(6);
  for(const e of db.events.filter(e=>e.date>=todayISO()&&e.date<=end)){
    if(e.calendarOwner==="family"){for(const x of result){x.count++;x.events++}}
    else{const p=db.family.find(x=>x.id===e.calendarOwner),x=p?byName(p.name):null;if(x){x.count++;x.events++}}
  }
  for(const t of db.tasks.filter(t=>!t.done&&t.due>=todayISO()&&t.due<=end)){const x=byName(t.who);if(x){x.count++;x.tasks++}}
  for(const s of db.school.filter(s=>!s.done&&s.date>=todayISO()&&s.date<=end)){const x=byName(s.child);if(x){x.count++;x.school++}}
  for(const r of db.routines.filter(r=>r.active!==false&&r.nextDate>=todayISO()&&r.nextDate<=end)){const x=byName(r.who);if(x){x.count++;x.routines++}}
  return result;
}
function weekLoadHTML(){
  const xs=weekLoad(),max=Math.max(1,...xs.map(x=>x.count));
  return `<div class="load-grid">${xs.map(x=>`<div class="load-person"><div class="myday-person">${avatar(x.name,true)}<div class="grow"><div class="title">${esc(x.name)}</div><div class="meta">${x.count} Punkte diese Woche</div></div></div><div class="meta">📅 ${x.events} · ✓ ${x.tasks} · 🎒 ${x.school} · 🔁 ${x.routines}</div><div class="load-bar"><i style="width:${Math.round(x.count/max*100)}%"></i></div></div>`).join("")}</div>`;
}
function addUpcomingMealIngredients(days=3){
  if(!requireGeneralEdit())return;
  const listId=state.shopList||db.shoppingLists[0]?.id;
  if(!listId)return alert("Bitte zuerst eine Einkaufsliste anlegen.");
  const meals=sortedMeals().filter(m=>{const o=mealDayOffset(m.day);return o>=0&&o<=Number(days)});
  const existing=new Set(db.shopping.filter(s=>s.listId===listId&&!s.done).map(s=>s.name.trim().toLowerCase()));
  let added=0,used=0;
  for(const m of meals){
    if(!m.ingredients?.length)continue;
    used++;
    for(const ing of m.ingredients){
      const name=String(ing||"").trim();if(!name||existing.has(name.toLowerCase()))continue;
      db.shopping.push({id:"s"+Date.now()+"-"+added,listId,name,qty:"1×",cat:"Essensplan",by:currentDisplayName(),note:`Für ${m.title}`,done:false,comments:[]});
      existing.add(name.toLowerCase());added++;
    }
  }
  if(added){addActivity("🍲",`hat ${added} fehlende Zutaten für die nächsten Gerichte zur Einkaufsliste hinzugefügt.`,"meal","");save();render()}
  alert(used?`${added} neue Zutat${added===1?"":"en"} hinzugefügt.`:"Für diesen Zeitraum sind noch keine Gerichte mit Zutaten geplant.");
}
function shiftAllOverdue(mode){
  if(!requireGeneralEdit())return;
  const xs=sortedOpenTasks().filter(isTaskOverdue);if(!xs.length)return;
  const label=mode==="tomorrow"?"morgen":"in eine Woche";
  if(!confirm(`${xs.length} überfällige Aufgabe${xs.length===1?"":"n"} auf ${label} verschieben?`))return;
  const d=new Date();d.setDate(d.getDate()+(mode==="tomorrow"?1:7));const due=d.toISOString().slice(0,10);
  for(const t of xs)t.due=due;
  addActivity("📆",`hat ${xs.length} überfällige Aufgabe${xs.length===1?"":"n"} auf ${label} verschoben.`,"task","");
  save();render();
}
function statusIsStale(s){
  if(!s?.updatedAt)return false;
  return Date.now()-new Date(s.updatedAt).getTime()>12*3600000;
}
function statusText(s){
  if(!s)return "—";
  return statusIsStale(s)?`${s.status||"—"} · veraltet`:s.status||"—";
}

function weekData(){
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    days.push({
      date:ds,d,
      events:db.events.filter(e=>e.date===ds).sort((a,b)=>String(a.time).localeCompare(String(b.time))),
      tasks:sortedOpenTasks(db.tasks.filter(t=>t.due===ds)),
      school:db.school.filter(s=>!s.done&&s.date===ds),
      meals:sortedMeals().filter(m=>mealDayOffset(m.day)===i)
    });
  }
  return days;
}

function nextWeekdayDate(target){
  const map={so:0,sonntag:0,mo:1,montag:1,di:2,dienstag:2,mi:3,mittwoch:3,do:4,donnerstag:4,fr:5,freitag:5,sa:6,samstag:6};
  const n=map[target.toLowerCase()];if(n===undefined)return null;
  const d=new Date();d.setHours(12,0,0,0);let diff=(n-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function parseQuickCapture(text){
  let raw=String(text||"").trim(),lower=raw.toLowerCase(),date=todayISO(),time="18:00",who=currentDisplayName();
  if(/\bübermorgen\b|\buebermorgen\b/.test(lower))date=plusDays(2);
  else if(/\bmorgen\b/.test(lower))date=plusDays(1);
  else{
    const wd=lower.match(/\b(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|mo|di|mi|do|fr|sa|so)\b/);
    if(wd){const x=nextWeekdayDate(wd[1]);if(x)date=x}
  }
  const tm=lower.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/);
  if(tm)time=`${String(tm[1]).padStart(2,"0")}:${tm[2]}`;
  for(const p of db.family){
    if(lower.includes("@"+p.name.toLowerCase())){who=p.name;break}
  }
  let kind="task";
  if(/\b(kaufen|besorgen|einkauf|einkaufen|mitbringen)\b/.test(lower)||/^einkauf\s*:/.test(lower))kind="shop";
  if(/\b(hausaufgabe|klassenarbeit|schularbeit|elternabend|schulausflug|schule)\b/.test(lower)||/^schule\s*:/.test(lower))kind="school";
  if(/\b(jeden|jede|täglich|taeglich|wöchentlich|woechentlich|monatlich|regelmäßig|regelmaessig)\b/.test(lower)||/^routine\s*:/.test(lower))kind="routine";
  if(/^notiz\s*:|^pinnwand\s*:/.test(lower))kind="note";
  if(/\b(termin|arzt|zahnarzt|friseur|meeting|besprechung)\b/.test(lower)||/^termin\s*:/.test(lower))kind="event";
  let title=raw
    .replace(/^(aufgabe|einkauf|schule|routine|notiz|pinnwand|termin)\s*:\s*/i,"")
    .replace(/\b(heute|morgen|übermorgen|uebermorgen)\b/gi,"")
    .replace(/\b(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/gi,"")
    .replace(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/g,"")
    .replace(new RegExp("@"+who.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"),"")
    .replace(/\s{2,}/g," ").trim();
  if(kind==="shop")title=title.replace(/\b(kaufen|besorgen|einkaufen)\b/gi,"").replace(/\s{2,}/g," ").trim();
  return {kind,title:title||raw,date,time,who};
}

  if(kind==="inbox")db.inbox.unshift({id,text:title,author:me,created:new Date().toISOString()});
  if(kind==="routine")db.routines.push({id,title,who:me,frequency:"weekly",interval:1,nextDate:date,time,note:"",active:true,lastDone:"",rotation:[],rotationIndex:0});

}

const DOC_BUCKET="familienhub-docs";
const docObjectUrls=new Map();
async function uploadDocumentFile(docId,file){
  if(!file)throw new Error("Bitte eine Datei auswählen.");
  if(!cloud.enabled||!cloud.familyId||!cloud.accessToken)throw new Error("Dokumente benötigen die Supabase-Familien-Synchronisierung.");
  await ensureFreshSession(false);
  const p=await prepareMediaFile(file);
  const objectId=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);
  const path=`${cloud.familyId}/${docId}/${objectId}.${p.ext}`;
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+DOC_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{method:"POST",headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken,"Content-Type":p.type,"x-upsert":"false"},body:p.blob});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw new Error(d.message||d.error||`Upload fehlgeschlagen (${r.status})`);
  return {path,name:safeFileName(p.name),type:p.type,size:p.blob.size};
}
async function fetchDocumentBlob(d){
  if(docObjectUrls.has(d.path))return docObjectUrls.get(d.path);
  await ensureFreshSession(false);
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/authenticated/"+DOC_BUCKET+"/"+d.path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  if(!r.ok){let e={};try{e=await r.json()}catch{};throw new Error(e.message||"Dokument konnte nicht geladen werden.")}
  const blob=await r.blob(),obj=URL.createObjectURL(blob);docObjectUrls.set(d.path,obj);return obj;
}
async function openDocument(id){
  const d=db.documents.find(x=>x.id===id);if(!d)return;
  try{const url=await fetchDocumentBlob(d);const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.click()}catch(e){alert(e.message)}
}
async function deleteDocument(id){
  if(!requireParent())return;
  const d=db.documents.find(x=>x.id===id);if(!d)return;
  if(!confirm(`„${d.title}“ wirklich löschen?`))return;
  try{
    await ensureFreshSession(false);
    const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+DOC_BUCKET+"/"+d.path.split("/").map(encodeURIComponent).join("/");
    await fetch(url,{method:"DELETE",headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  }catch(e){console.warn(e)}
  db.documents=db.documents.filter(x=>x.id!==id);
  addActivity("🗑️",`hat das Dokument „${d.title}“ gelöscht.`,"document",id);
  save();render();
}


function documentState(d){
  if(!d.expires)return {cls:"ok",label:"ohne Ablauf"};
  const n=daysUntil(d.expires);
  if(n<0)return {cls:"expired",label:"abgelaufen"};
  if(n<=60)return {cls:"soon",label:`läuft in ${n} Tag${n===1?"":"en"} ab`};
  return {cls:"ok",label:"gültig"};
}

  if(!requireParent())return;
  const d=db.documents.find(x=>x.id===id);if(!d||!d.expires)return;

  if(db.tasks.some(t=>!t.done&&t.title.toLowerCase()===title.toLowerCase()))return alert("Dafür gibt es bereits eine offene Aufgabe.");
  const dueDate=new Date(d.expires+"T12:00");dueDate.setDate(dueDate.getDate()-30);
  const rawDue=dueDate.toISOString().slice(0,10),due=rawDue<todayISO()?todayISO():rawDue;
  const who=db.family.some(p=>p.name===d.owner)?d.owner:currentDisplayName();

  db.tasks.push({id:tid,title,due,time:"18:00",who,prio:"high",repeat:"none",remindMinutes:1440,note:`Dokument: ${d.category||"Dokument"} · gültig bis ${fmtDate(d.expires)}`,done:false,completedAt:null,comments:[]});
  addActivity("📂",`hat die Erneuerung von „${d.title}“ als Aufgabe geplant.`,"task",tid);
  save();render();
}

function familyCockpitData(){
  const today=todayISO(),end=plusDays(6);
  return db.family.map(p=>{
    const eventsToday=db.events.filter(e=>e.date===today&&(e.calendarOwner==="family"||e.calendarOwner===p.id));
    const tasksToday=db.tasks.filter(t=>!t.done&&t.who===p.name&&(t.due===today||isTaskOverdue(t)));
    const schoolToday=db.school.filter(s=>!s.done&&s.child===p.name&&s.date===today);
    const routinesToday=db.routines.filter(r=>r.active!==false&&r.who===p.name&&r.nextDate<=today);
    const weekEvents=db.events.filter(e=>e.date>=today&&e.date<=end&&(e.calendarOwner==="family"||e.calendarOwner===p.id)).length;
    const weekTasks=db.tasks.filter(t=>!t.done&&t.who===p.name&&t.due>=today&&t.due<=end).length;
    const weekSchool=db.school.filter(s=>!s.done&&s.child===p.name&&s.date>=today&&s.date<=end).length;
    const weekRoutines=db.routines.filter(r=>r.active!==false&&r.who===p.name&&r.nextDate>=today&&r.nextDate<=end).length;
    const nextEvent=[...db.events].filter(e=>e.date>=today&&(e.calendarOwner==="family"||e.calendarOwner===p.id)).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))[0]||null;
    const overdue=db.tasks.filter(t=>!t.done&&t.who===p.name&&isTaskOverdue(t)).length;
    return {p,status:statusFor(p.name),eventsToday,tasksToday,schoolToday,routinesToday,weekEvents,weekTasks,weekSchool,weekRoutines,nextEvent,overdue};
  });
}

function dueReminderItems(){
  const now=new Date(),until=new Date(Date.now()+24*3600000);
  return reminderItems().filter(r=>!localStorage.getItem(reminderDismissKey(r.key))).map(r=>({...r,effectiveTrigger:effectiveReminderTrigger(r)})).filter(r=>r.effectiveTrigger<=until&&r.due>=new Date(now.getTime()-86400000)).sort((a,b)=>a.effectiveTrigger-b.effectiveTrigger);
}

function frequentShopping(listId){

    const cur=map.get(k)||{name:s.name,qty:s.qty,cat:s.cat,count:0,last:s};

const GIFT_BUCKET="familienhub-gifts";
const giftPhotoUrls=new Map();
async function uploadGiftPhoto(giftId,file){
  if(!file)return null;
  if(!cloud.enabled||!cloud.familyId||!cloud.accessToken)throw new Error("Geschenk-Fotos benötigen die Supabase-Familien-Synchronisierung.");
  await ensureFreshSession(false);
  const p=await prepareMediaFile(file);
  if(!p.type.startsWith("image/"))throw new Error("Bitte ein Bild auswählen.");
  const objectId=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);
  const path=`${cloud.familyId}/${giftId}/${objectId}.${p.ext}`;
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+GIFT_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{method:"POST",headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken,"Content-Type":p.type,"x-upsert":"false"},body:p.blob});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw new Error(d.message||d.error||`Upload fehlgeschlagen (${r.status})`);
  return {path,name:safeFileName(p.name),type:p.type,size:p.blob.size};
}
async function fetchGiftPhoto(photo){
  if(!photo?.path)return "";
  if(giftPhotoUrls.has(photo.path))return giftPhotoUrls.get(photo.path);
  await ensureFreshSession(false);
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/authenticated/"+GIFT_BUCKET+"/"+photo.path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  if(!r.ok)return "";
  const blob=await r.blob(),obj=URL.createObjectURL(blob);
  giftPhotoUrls.set(photo.path,obj);return obj;
}
async function deleteGiftPhotoObject(photo){
  if(!photo?.path||!cloud.enabled)return;
  try{
    await ensureFreshSession(false);
    const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+GIFT_BUCKET+"/"+photo.path.split("/").map(encodeURIComponent).join("/");
    await fetch(url,{method:"DELETE",headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  }catch(e){console.warn("Gift photo delete:",e)}
}
async function loadGiftPhotos(){
  if(!canManageFamily())return;
  const els=[...document.querySelectorAll("[data-gift-photo]")];
  for(const el of els){
    const id=el.dataset.giftPhoto,g=db.gifts.find(x=>x.id===id);
    if(!g?.photo)continue;
    try{const u=await fetchGiftPhoto(g.photo);if(u)el.src=u}catch(e){console.warn("Gift photo:",e)}
  }
}

  const who=db.family.find(p=>p.id===e.calendarOwner)?.name||currentDisplayName();
  const d=new Date(e.date+"T12:00");d.setDate(d.getDate()+1);
  const title=prompt("Welche Aufgabe soll aus dem Termin entstehen?",`${e.title} nachbereiten`);
  if(!title?.trim())return;
  const tid="t"+Date.now();
  db.tasks.push({id:tid,title:title.trim(),due:d.toISOString().slice(0,10),time:"18:00",who,prio:"med",repeat:"none",remindMinutes:60,note:`Aus Termin: ${e.title}`,done:false,completedAt:null,comments:[]});

}

function currentDisplayName(){
  return cloud.displayName || db.settings.currentUser || db.family[0]?.name || "Familie";

function reminderText(minutes){
  const n=Number(minutes||0);
  if(n<=0)return "keine Erinnerung";
  if(n<60)return `${n} Min vorher`;
  if(n===60)return "1 Std vorher";
  if(n<1440)return `${Math.round(n/60)} Std vorher`;
  if(n===1440)return "1 Tag vorher";
  return `${Math.round(n/1440)} Tage vorher`;
}
function reminderDateText(d){
  return d.toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}
function reminderItems(){
  const items=[];
  for(const e of db.events){
    const mins=Number(e.remindMinutes||0);if(mins<=0)continue;
    const due=new Date(`${e.date}T${e.time||"09:00"}`);
    const trigger=new Date(due.getTime()-mins*60000);
    items.push({key:`event-${e.id}-${trigger.getTime()}`,icon:"📅",type:"Termin",title:e.title,meta:`${calendarName(e.calendarOwner)} · ${reminderText(mins)}`,trigger,due,refType:"event",refId:e.id});
  }
  for(const t of db.tasks.filter(x=>!x.done)){
    const mins=Number(t.remindMinutes||0);if(mins<=0)continue;
    const due=new Date(`${t.due}T${t.time||"18:00"}`);
    const trigger=new Date(due.getTime()-mins*60000);
    items.push({key:`task-${t.id}-${trigger.getTime()}`,icon:"✓",type:"Aufgabe",title:t.title,meta:`${t.who} · ${reminderText(mins)}`,trigger,due,refType:"task",refId:t.id});
  }
  for(const o of db.occasions){
    const days=Number(o.remind||0);if(days<=0)continue;
    const due=new Date(`${o.date}T09:00`);
    const trigger=new Date(due.getTime()-days*86400000);
    items.push({key:`occasion-${o.id}-${trigger.getTime()}`,icon:"🎉",type:o.kind||"Anlass",title:o.title,meta:`${days} Tage vorher`,trigger,due,refType:"occasion",refId:o.id});
  }
  for(const m of db.houseMaintenance){
    const days=Number(m.reminderDays??30);if(days<=0)continue;
    const due=new Date(`${m.nextDate}T09:00`);
    const trigger=new Date(due.getTime()-days*86400000);
    items.push({key:`maint-${m.id}-${trigger.getTime()}`,icon:"🛠️",type:"Wartung",title:m.title,meta:`${m.area} · ${days} Tage vorher`,trigger,due,refType:"maintenance",refId:m.id});
  }
  for(const r of db.routines.filter(x=>x.active!==false)){
    if(!r.nextDate)continue;
    const due=new Date(`${r.nextDate}T${r.time||"18:00"}`),trigger=new Date(due.getTime()-60*60000);
    items.push({key:`routine-${r.id}-${trigger.getTime()}`,icon:"🔁",type:"Routine",title:r.title,meta:`${r.who} · 1 Std vorher`,trigger,due,refType:"routine",refId:r.id});
  }
  for(const s of db.school.filter(x=>!x.done)){
    if(!s.date)continue;
    const due=new Date(`${s.date}T${s.time||"18:00"}`),trigger=new Date(due.getTime()-1440*60000);
    items.push({key:`school-${s.id}-${trigger.getTime()}`,icon:"🎒",type:"Schule",title:s.title,meta:`${s.child} · 1 Tag vorher`,trigger,due,refType:"school",refId:s.id});
  }
  for(const d of db.documents){
    if(!d.expires)continue;
    const due=new Date(`${d.expires}T09:00`),trigger=new Date(due.getTime()-30*86400000);
    items.push({key:`doc-${d.id}-${trigger.getTime()}`,icon:"📂",type:"Dokument",title:d.title,meta:"läuft in 30 Tagen ab",trigger,due,refType:"document",refId:d.id});
  }
  for(const t of db.trips){
    if(!t.startDate)continue;
    const due=new Date(`${t.startDate}T09:00`),trigger=new Date(due.getTime()-7*86400000);
    items.push({key:`trip-${t.id}-${trigger.getTime()}`,icon:"🧳",type:"Reise",title:t.title,meta:"Start in 1 Woche",trigger,due,refType:"trip",refId:t.id});
  }
  return items.filter(x=>!Number.isNaN(x.trigger.getTime())).sort((a,b)=>a.trigger-b.trigger);
}

function reminderSnoozeKey(key){return "fh-snooze-"+key}
function reminderDismissKey(key){return "fh-dismiss-"+key}

function snoozeReminder(key,minutes){

function snoozeReminderTomorrow(key){

  const xs=Array.isArray(t.subtasks)?t.subtasks:[],done=xs.filter(s=>s.done).length;

function parseRenoSubtasks(text,existing=[]){
  const old=new Map((existing||[]).map(s=>[String(s.title||"").trim().toLowerCase(),s]));
  return String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).map((line,i)=>{
    const done=/^\[(x|✓)\]\s*/i.test(line);
    const title=line.replace(/^\[(x|✓| )\]\s*/i,"").replace(/^[-•]\s*/,"").trim();
    if(!title)return null;
    const prev=old.get(title.toLowerCase());
    return {id:prev?.id||("rs"+Date.now()+"-"+i+"-"+Math.random().toString(36).slice(2,5)),title,done:done||!!prev?.done};
  }).filter(Boolean);
}

async function uploadRenovationFiles(kind,recordId,files){
  const list=[...(files||[])].slice(0,6);if(!list.length)return [];
  if(!cloud.enabled||!cloud.familyId||!cloud.accessToken)throw new Error("Bilder/PDFs benötigen die Familien-Synchronisierung mit Supabase.");
  await ensureFreshSession(false);
  const out=[];
  for(const original of list){
    const p=await prepareMediaFile(original);
    const objectId=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);
    const path=`${cloud.familyId}/${kind}/${recordId}/${objectId}.${p.ext}`;
    const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+RENOVATION_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/");
    const r=await fetch(url,{method:"POST",headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken,"Content-Type":p.type,"x-upsert":"false"},body:p.blob});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.message||d.error||`${original.name}: Upload fehlgeschlagen (${r.status})`);
    out.push({id:objectId,name:safeFileName(p.name),type:p.type,path,size:p.blob.size});
  }
  return out;
}
async function fetchRenovationAttachment(att){
  if(!att?.path)return "";
  if(renovationObjectUrls.has(att.path))return renovationObjectUrls.get(att.path);
  await ensureFreshSession(false);
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/authenticated/"+RENOVATION_BUCKET+"/"+att.path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  if(!r.ok)throw new Error("Datei konnte nicht geladen werden.");
  const blob=await r.blob(),obj=URL.createObjectURL(blob);renovationObjectUrls.set(att.path,obj);return obj;
}
async function openRenovationAttachment(path){
  let att=null;
  for(const c of ["renovationRooms","renovationTasks","renovationOffers"]){
    for(const x of db[c]){const a=(x.attachments||[]).find(z=>z.path===path);if(a){att=a;break}}
    if(att)break;
  }
  if(!att)return;
  try{const url=await fetchRenovationAttachment(att);const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.click()}catch(e){alert(e.message)}
}
async function deleteRenovationStorage(path){
  if(!path||!cloud.enabled)return;
  await ensureFreshSession(false);
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+RENOVATION_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{method:"DELETE",headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  if(!r.ok&&r.status!==404)throw new Error("Datei konnte nicht gelöscht werden.");
  const old=renovationObjectUrls.get(path);if(old){URL.revokeObjectURL(old);renovationObjectUrls.delete(path)}
}

function renovationMaterialToShopping(id){
  if(!requireParent())return;const m=db.renovationMaterials.find(x=>x.id===id);if(!m)return;
  const listId=state.shopList||db.shoppingLists.find(l=>l.name.toLowerCase().includes("baumarkt"))?.id||db.shoppingLists[0]?.id;
  if(!listId)return alert("Bitte zuerst eine Einkaufsliste anlegen.");
  if(db.shopping.some(s=>s.listId===listId&&!s.done&&s.name.trim().toLowerCase()===m.title.trim().toLowerCase()))return alert("Steht bereits auf der Einkaufsliste.");
  db.shopping.push({id:"s"+Date.now(),listId,name:m.title,qty:m.qty||"1×",cat:"Haussanierung",by:currentDisplayName(),note:`${renoRoomName(m.roomId)}${m.store?` · ${m.store}`:""}`,done:false,comments:[]});
  m.pushedToShopping=true;save();render();
}
async function deleteRenovationRecord(collection,id){
  if(!requireParent())return;const x=db[collection]?.find(v=>v.id===id);if(!x)return;
  if(!confirm(`„${x.title||x.name}“ wirklich löschen?`))return;
  for(const a of (x.attachments||[])){try{await deleteRenovationStorage(a.path)}catch(e){}}
  db[collection]=db[collection].filter(v=>v.id!==id);
  if(collection==="renovationRooms"){
    for(const t of db.renovationTasks)if(t.roomId===id)t.roomId="";
    for(const m of db.renovationMaterials)if(m.roomId===id)m.roomId="";
    for(const o of db.renovationOffers)if(o.roomId===id)o.roomId="";
    for(const d of db.renovationDecisions)if(d.roomId===id)d.roomId="";
  }
  if(collection==="renovationContractors"){
    for(const t of db.renovationTasks)if(t.contractorId===id)t.contractorId="";
    for(const o of db.renovationOffers)if(o.contractorId===id)o.contractorId="";
  }
  if(collection==="renovationTasks"){
    for(const t of db.renovationTasks)if(t.blockedBy===id)t.blockedBy="";
    for(const o of db.renovationOffers)if(o.taskId===id)o.taskId="";
  }
  save();render();
}

async function saveRenovationModal(t){
  if(!requireParent())return;
  const edit=t.endsWith("Edit"),base=t.replace(/^reno/,"").replace(/Edit$/,""),id=state.modal.editId||("r"+Date.now()+"-"+Math.random().toString(36).slice(2,6));
  const title=val("rTitle");if(!title)return alert("Bitte einen Titel eingeben.");
  let x=null;
  const maps={Room:"renovationRooms",Task:"renovationTasks",Material:"renovationMaterials",Contractor:"renovationContractors",Offer:"renovationOffers",Decision:"renovationDecisions"};
  const mapBase=base==="TaskForRoom"?"Task":base,collection=maps[mapBase];
  if(edit)x=db[collection].find(v=>v.id===id);
  if(!x){x={id};db[collection].push(x)}
  if(mapBase==="Room"){
    x.name=title;x.floor=val("rFloor");x.budget=Number(val("rBudget")||0);x.note=val("rNote");if(!Array.isArray(x.attachments))x.attachments=[];
    const files=document.getElementById("rFiles")?.files;if(files?.length){try{x.attachments.push(...await uploadRenovationFiles("room",x.id,files))}catch(e){return alert(e.message)}}
  }
  if(mapBase==="Task"){
    x.title=title;x.roomId=val("rRoom");x.status=val("rStatus")||"open";x.priority=val("rPriority")||"med";x.trade=val("rTrade");x.dueDate=val("rDate");x.assignedTo=val("rPerson");x.contractorRequired=val("rContractorRequired")==="1";x.contractorId=val("rContractor");x.blockedBy=val("rBlockedBy");x.budget=Number(val("rBudget")||0);x.actual=Number(val("rActual")||0);x.note=val("rNote");const subEl=document.getElementById("rSubtasks");if(subEl)x.subtasks=parseRenoSubtasks(subEl.value,x.subtasks||[]);else if(!Array.isArray(x.subtasks))x.subtasks=[];if(!Array.isArray(x.attachments))x.attachments=[];
    const files=document.getElementById("rFiles")?.files;if(files?.length){try{x.attachments.push(...await uploadRenovationFiles("task",x.id,files))}catch(e){return alert(e.message)}}
  }
  if(mapBase==="Material"){x.title=title;x.roomId=val("rRoom");x.qty=val("rQty");x.status=val("rMatStatus")||"needed";x.priority=val("rPriority")||"med";x.store=val("rStore");x.budget=Number(val("rBudget")||0);x.actual=Number(val("rActual")||0);x.note=val("rNote");if(x.pushedToShopping===undefined)x.pushedToShopping=false}
  if(mapBase==="Contractor"){x.name=title;x.trade=val("rTrade");x.contact=val("rContact");x.phone=val("rPhone");x.email=val("rEmail");x.status=val("rContractorStatus")||"candidate";x.note=val("rNote")}
  if(mapBase==="Offer"){
    x.title=title;x.contractorId=val("rContractor");x.trade=val("rTrade");x.roomId=val("rRoom");x.taskId=val("rTask");x.amount=Number(val("rAmount")||0);x.status=val("rOfferStatus")||"received";x.date=val("rDate");x.validUntil=val("rValidUntil");x.note=val("rNote");if(!Array.isArray(x.attachments))x.attachments=[];
    const files=document.getElementById("rFiles")?.files;if(files?.length){try{x.attachments.push(...await uploadRenovationFiles("offer",x.id,files))}catch(e){return alert(e.message)}}
  }
  if(mapBase==="Decision"){x.title=title;x.roomId=val("rRoom");x.status=val("rDecisionStatus")||"open";x.deadline=val("rDate");x.options=val("rOptions");x.choice=val("rChoice");x.note=val("rNote")}
  x.updatedAt=new Date().toISOString();if(!x.createdAt)x.createdAt=x.updatedAt;
  state.modal=null;save();render();
}

function captureModalDraft(){
 if(!state.modal)return;
 const modal=document.querySelector(".modal");
 if(!modal)return;
 const values={};
 modal.querySelectorAll("input,select,textarea").forEach(el=>{
   if(el.id)values[el.id]=el.value;
 });
 state.modal.values=values;
}
function restoreModalDraft(){
 if(!state.modal?.values)return;
 for(const [id,value] of Object.entries(state.modal.values)){
   const el=document.getElementById(id);
   if(el)el.value=value;
 }
}
function renderCrash(err){
  console.error("FamilienHub Renderfehler:",err);
  const root=document.getElementById("root");
  if(!root)return;
  root.innerHTML=`<div class="crash-box"><h2>FamilienHub konnte diese Ansicht nicht laden</h2><p>Deine Daten sind weiterhin gespeichert. Die App zeigt jetzt statt einer weißen Seite diese Fehlerseite.</p><div class="crash-code">${esc(err?.stack||err?.message||String(err))}</div><div class="toolbar"><button class="primary" onclick="state.view='today';state.modal=null;state.itemDetail=null;state.noteDetailId=null;render()">Zur Heute-Seite</button><button class="ghost" onclick="location.reload()">Neu laden</button><button class="ghost" onclick="exportJSON()">Backup exportieren</button></div></div>`;
}
function render(){

   captureModalDraft();
   const m={today:todayView,renovation:renovationView,gifts:giftsView,cockpit:familyCockpitView,myday:myDayView,prep:prepView,calendar:calendarView,tasks:tasksView,shopping:shoppingView,wishes:wishesView,more:moreView,occasions:occasionsView,notes:notesView,family:familyView,meals:mealsView,home:homeView,backup:backupView,inbox:inboxView,activity:activityView,dashboard:dashboardSettingsView,week:weekView,routines:routinesView,school:schoolView,pantry:pantryView,trips:tripsView,documents:documentsView,status:familyStatusView,reminders:remindersView,house:houseView,roles:rolesView,cloud:cloudView,passwordReset:passwordResetView,install:installView};
   document.getElementById("root").innerHTML=shell((m[state.view]||todayView)());
   restoreModalDraft();
   checkReminders();
   if(state.noteDetailId)setTimeout(()=>loadNoteAttachments(state.noteDetailId),30);
   if(state.view==="gifts"&&canManageFamily())setTimeout(loadGiftPhotos,40);
   setTimeout(initSwipeRows,0);

 }catch(e){renderCrash(e)}

let photoPersonId=null;
function editPhoto(id){if(!requireParent())return;photoPersonId=id;document.getElementById("photoPicker").click()}
function savePhoto(ev){
 const file=ev.target.files[0];if(!file||!requireParent())return;
 const reader=new FileReader();
 reader.onload=()=>{const img=new Image();img.onload=()=>{const size=256,canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;const ctx=canvas.getContext("2d"),scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);const p=db.family.find(x=>x.id===photoPersonId);if(p){p.photo=canvas.toDataURL("image/jpeg",.78);save();render()}};img.src=reader.result};reader.readAsDataURL(file)
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download("FamilienHub-Backup.json",JSON.stringify(db,null,2),"application/json")}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert("Backup importiert.")}catch{alert("Ungültige Backup-Datei.")}};r.readAsText(f)}
function exportICS(){let txt="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FamilienHub//DE\r\n";for(const e of db.events){const dt=e.date.replaceAll("-","")+ "T"+e.time.replace(":","")+"00";txt+=`BEGIN:VEVENT\r\nUID:${e.id}@familienhub\r\nDTSTART:${dt}\r\nSUMMARY:${e.title.replaceAll("\n"," ")}\r\nDESCRIPTION:Kalender: ${calendarName(e.calendarOwner)}\r\nLOCATION:${(e.place||"").replaceAll("\n"," ")}\r\nEND:VEVENT\r\n`}txt+="END:VCALENDAR\r\n";download("FamilienHub-Kalender.ics",txt,"text/calendar")}
function resetDemo(){if(confirm("Alle lokalen Daten zurücksetzen?")){localStorage.removeItem(KEY);db=structuredClone(seed);render()}}
async function enableNotifications(){if(!("Notification"in window)){alert("Benachrichtigungen werden von diesem Browser nicht unterstützt.");return}const p=await Notification.requestPermission();db.settings.notifications=p==="granted";save();if(p==="granted")new Notification("FamilienHub",{body:"Erinnerungen sind aktiviert."});render()}
function checkReminders(){
 if(!db.settings.notifications||!("Notification"in window)||Notification.permission!=="granted")return;
 const now=new Date();
 for(const r of reminderItems()){
   if(localStorage.getItem(reminderDismissKey(r.key)))continue;
   const trigger=effectiveReminderTrigger(r);
   const age=now-trigger;
   if(age<0||age>7*86400000)continue;
   const key="fh-notified-"+r.key;
   if(localStorage.getItem(key))continue;
   new Notification(`${r.icon} ${r.type}: ${r.title}`,{
     body:`${r.meta} · ${reminderDateText(r.due)}`
   });
   localStorage.setItem(key,new Date().toISOString());
 }
}
async function connectHA(){if(!requireParent())return;const url=document.getElementById("haUrl").value.trim().replace(/\/$/,""),token=document.getElementById("haToken").value.trim();if(!url||!token)return;const box=document.getElementById("haStatus");box.textContent="Verbinde…";try{const r=await fetch(url+"/api/states",{headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);const all=await r.json();const ents=all.filter(x=>["light.","switch.","cover."].some(p=>x.entity_id.startsWith(p))).slice(0,30).map(x=>({entity_id:x.entity_id,name:x.attributes.friendly_name||x.entity_id,room:"Home Assistant",icon:x.entity_id.startsWith("cover.")?"🪟":"💡",state:x.state}));const scenes=all.filter(x=>x.entity_id.startsWith("scene.")).slice(0,20).map(x=>({entity_id:x.entity_id,name:x.attributes.friendly_name||x.entity_id}));db.ha={url,token,connected:true,entities:ents,scenes};save();render()}catch(e){box.textContent="Verbindung fehlgeschlagen: "+e.message}}
function disconnectHA(){if(!requireParent())return;db.ha.connected=false;db.ha.entities=[];db.ha.scenes=[];save();render()}

async function activateHAScene(entity){
  if(!requireGeneralEdit()||!db.ha.connected)return;
  try{
    const r=await fetch(`${db.ha.url}/api/services/scene/turn_on`,{method:"POST",headers:{Authorization:"Bearer "+db.ha.token,"Content-Type":"application/json"},body:JSON.stringify({entity_id:entity})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const s=(db.ha.scenes||[]).find(x=>x.entity_id===entity);
    addActivity("🏠",`hat die Home-Assistant-Szene „${s?.name||entity}“ gestartet.`,"home",entity);
    save();
  }catch(e){alert("Szene konnte nicht gestartet werden: "+e.message)}
}

async function haToggle(entity,stateNow){if(!requireGeneralEdit()||!db.ha.connected)return;const domain=entity.split(".")[0];let service;if(domain==="cover")service=(stateNow==="open"?"close_cover":"open_cover");else service=(stateNow==="on"?"turn_off":"turn_on");try{await fetch(`${db.ha.url}/api/services/${domain}/${service}`,{method:"POST",headers:{Authorization:"Bearer "+db.ha.token,"Content-Type":"application/json"},body:JSON.stringify({entity_id:entity})});setTimeout(connectHARefresh,500)}catch(e){alert("Schalten fehlgeschlagen: "+e.message)}}
async function connectHARefresh(){try{const r=await fetch(db.ha.url+"/api/states",{headers:{Authorization:"Bearer "+db.ha.token}});const all=await r.json();db.ha.entities=db.ha.entities.map(e=>{const n=all.find(x=>x.entity_id===e.entity_id);return n?{...e,state:n.state}:e});save();render()}catch{}}

  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      reg.addEventListener("updatefound",()=>console.log("FamilienHub Update gefunden."));
    }catch(e){console.warn("Service Worker:",e)}
  });
}

window.addEventListener("error",e=>{
  if(e.error&&document.getElementById("root")&&!document.getElementById("root").innerHTML.trim())renderCrash(e.error);
});
window.addEventListener("unhandledrejection",e=>console.warn("FamilienHub async:",e.reason));
window.state=state;
createRestorePoint("start",false);
setInterval(()=>{try{checkReminders()}catch(e){console.warn("Reminder-Intervall:",e)}},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){try{checkReminders()}catch(e){}}});
const recoveryDetected=detectPasswordRecovery();
if(!recoveryDetected&&cloud.enabled&&cloud.accessToken){bootstrapCloud()}
document.addEventListener("click",e=>{
  if(!e.target.closest(".swipe-item")){
    closeOtherSwipeRows(null);
  }
});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&cloud.enabled&&cloud.accessToken){
    ensureFreshSession(false).then(()=>cloud.familyId&&cloudSyncCycle(true)).catch(e=>setCloudStatus(e.message,false));
  }
});
render();
