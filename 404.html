<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5eee6">
<title>FamilienHub v5</title>
<style>
:root{
  --bg:#f6efe7;--card:#fffaf5;--card2:#f2e7dc;--line:#e6d7ca;--ink:#483d37;--muted:#8e8075;
  --accent:#b56e52;--sage:#718c70;--gold:#d29b56;--red:#b95f59;--blue:#6f87a7;
  --shadow:0 12px 34px rgba(75,53,38,.10);--r:22px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:0 max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;background:rgba(246,239,231,.94);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#d9ad88,#b56e52);display:grid;place-items:center;color:white;font-size:23px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:0}.small,.muted{color:var(--muted);font-size:12px}
.avatars{display:flex;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:3px solid white;margin-left:-6px;background:#b56e52;color:white;display:grid;place-items:center;font-weight:750;box-shadow:0 3px 9px #0001}.avatar.sm{width:30px;height:30px;border-width:2px;margin:0}
.hero{background:linear-gradient(135deg,#fff9f2,#efe0d1);border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:var(--shadow);margin:6px 0 16px}.hero h2{font-size:29px;margin:6px 0}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:0 7px 20px rgba(75,53,38,.05)}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card h3{font-size:17px;margin:0 0 12px}.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #eee2d8}.row:first-of-type{border-top:0}.grow{flex:1;min-width:0}.title{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:3px}.time{color:var(--accent);font-size:12px;font-weight:750;min-width:44px}
.primary,.ghost,.danger,.iconbtn{border:0;border-radius:13px;padding:9px 12px}.primary{background:var(--accent);color:#fff}.ghost{background:#f0e5da;color:var(--ink)}.danger{background:#f4dfdc;color:#9f4e49}.iconbtn{background:#f3e8de}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.section-title{display:flex;align-items:center;justify-content:space-between;margin:5px 0 13px}.section-title h2{margin:0}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #b6a79b;background:#fff}.check.done{background:var(--sage);border-color:var(--sage);color:#fff}.priority{width:7px;height:28px;border-radius:6px;background:#d6c7ba}.priority.med{background:var(--gold)}.priority.high{background:var(--red)}
.notice{padding:11px 13px;border-radius:14px;background:#f0e9df;color:var(--muted);font-size:12px}.success{background:#e6efe5;color:#577057}.warning{background:#f7ecd9;color:#8d6a35}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(780px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:7px;background:rgba(255,250,245,.96);backdrop-filter:blur(15px);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);z-index:30}.nav{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 2px;font-size:10px}.nav b{display:block;font-size:18px;margin-bottom:2px}.nav.active{background:#f0e2d6;color:var(--accent);font-weight:700}
.modalbg{position:fixed;inset:0;background:#2c221c55;z-index:40;display:grid;place-items:end center}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fffaf5;border-radius:28px 28px 0 0;padding:21px;box-shadow:0 -12px 40px #0002}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px;color:var(--ink)}textarea{min-height:82px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.shopping-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.shop-tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.shop-tab.active{background:#f0e2d6;color:var(--accent);border-color:#e2c6b4}.shop-tab .avatar{display:inline-grid;vertical-align:middle;margin-right:5px}
.calendar-list .row{align-items:flex-start}.badge{font-size:11px;border-radius:999px;padding:4px 8px;background:#f1e6dc;color:var(--muted)}
.person-card{display:flex;align-items:center;gap:13px}.person-card .avatar{width:54px;height:54px;margin:0}.person-actions{margin-left:auto}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.device{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;align-items:center;gap:9px}.sw{margin-left:auto;width:42px;height:24px;border-radius:999px;background:#d8cec6;padding:3px}.sw i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--sage)}.sw.on i{transform:translateX(18px)}
.photo-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#eee;border:2px solid #fff;box-shadow:0 3px 12px #0001}
.kpi{font-size:26px;font-weight:800}.kpi-label{font-size:12px;color:var(--muted)}
.cloud-status{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:14px;background:#f0e9df;font-size:12px;color:var(--muted)}
.cloud-dot{width:9px;height:9px;border-radius:50%;background:#b9aaa0}.cloud-dot.on{background:var(--sage)}
.codebox{background:#3e3733;color:#fff8f1;border-radius:15px;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow:auto}
.sync-log{font-size:11px;color:var(--muted);margin-top:7px}
.role-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;background:#f1e6dc;color:var(--muted)}
.role-parent{background:#e5eee3;color:#557054}.role-child{background:#e7edf4;color:#60758f}.role-guest{background:#eee8e3;color:#81736a}
.member-line{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #eee2d8}.member-line:first-child{border-top:0}
.locked-card{opacity:.78}
.pwa-install-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px}
@media(max-width:760px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.form{grid-template-columns:1fr}.full{grid-column:auto}.homegrid{grid-template-columns:1fr}.hero h2{font-size:25px}.brand .small{display:none}}
</style>

<body>
<div id="root"></div>
<script>
const KEY="familienhub-v3-data";
const todayISO=()=>new Date().toISOString().slice(0,10);
const plusDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const seed={
 family:[
  {id:"p1",name:"Papa",role:"Elternteil",photo:"",tone:"#b56e52"},
  {id:"p2",name:"Mama",role:"Elternteil",photo:"",tone:"#6f87a7"},
  {id:"p3",name:"Lina",role:"Kind",photo:"",tone:"#718c70"},
  {id:"p4",name:"Noah",role:"Kind",photo:"",tone:"#b98b56"}
 ],
 events:[
  {id:"e1",title:"Schule",date:todayISO(),time:"08:00",person:"Lina",place:""},
  {id:"e2",title:"Zahnarzt",date:todayISO(),time:"15:30",person:"Mama",place:"Praxis"},
  {id:"e3",title:"Familienabend",date:todayISO(),time:"18:00",person:"Alle",place:"Zuhause"},
  {id:"e4",title:"Fußballtraining",date:plusDays(2),time:"17:00",person:"Noah",place:"Sportplatz"}
 ],
 tasks:[
  {id:"t1",title:"Mülltonne rausstellen",due:todayISO(),time:"19:00",who:"Papa",prio:"med",repeat:"weekly",done:false,completedAt:null},
  {id:"t2",title:"Paket abholen",due:todayISO(),time:"17:30",who:"Mama",prio:"high",repeat:"none",done:false,completedAt:null},
  {id:"t3",title:"Pflanzen gießen",due:plusDays(1),time:"18:00",who:"Lina",prio:"low",repeat:"weekly",done:false,completedAt:null}
 ],
 shoppingLists:[
  {id:"l1",name:"Lebensmittel",icon:"🛒"},
  {id:"l2",name:"Drogerie",icon:"🧴"},
  {id:"l3",name:"Baumarkt",icon:"🔨"}
 ],
 shopping:[
  {id:"s1",listId:"l1",name:"Milch",qty:"2×",cat:"Milchprodukte",by:"Mama",done:false},
  {id:"s2",listId:"l1",name:"Brot",qty:"1×",cat:"Backwaren",by:"Papa",done:false},
  {id:"s3",listId:"l2",name:"Waschmittel",qty:"1×",cat:"Haushalt",by:"Mama",done:false},
  {id:"s4",listId:"l3",name:"8-mm-Dübel",qty:"1 Pack",cat:"Befestigung",by:"Papa",done:false}
 ],
 wishes:[
  {id:"w1",owner:"Lina",title:"Kopfhörer",note:"am liebsten beige",url:"",reserved:false,reservedBy:null},
  {id:"w2",owner:"Noah",title:"Lego-Set",note:"Weltraum",url:"",reserved:true,reservedBy:"Papa"},
  {id:"w3",owner:"Mama",title:"Italienisches Kochbuch",note:"",url:"",reserved:false,reservedBy:null}
 ],
 occasions:[
  {id:"o1",title:"Geburtstag Lina",date:plusDays(38),kind:"Geburtstag",remind:14},
  {id:"o2",title:"Hochzeitstag",date:plusDays(95),kind:"Jahrestag",remind:7}
 ],
 notes:[
  {id:"n1",text:"Samstag 14 Uhr: gemeinsam Kuchen backen 🍰",author:"Mama",created:new Date().toISOString()},
  {id:"n2",text:"Bitte Schulsachen für Montag prüfen.",author:"Papa",created:new Date().toISOString()}
 ],
 meals:[
  {id:"m1",day:"Heute",title:"Pasta mit Tomatensoße"},
  {id:"m2",day:"Morgen",title:"Ofengemüse & Feta"},
  {id:"m3",day:"Freitag",title:"Selbstgemachte Pizza"}
 ],
 settings:{notifications:false,currentUser:"Papa"},
 ha:{url:"",token:"",connected:false,entities:[]},
 demoDevices:[
  {id:"d1",entity_id:"light.wohnzimmer",room:"Wohnzimmer",name:"Deckenlicht",icon:"💡",state:"on"},
  {id:"d2",entity_id:"cover.wohnzimmer",room:"Wohnzimmer",name:"Rollladen",icon:"🪟",state:"closed"},
  {id:"d3",entity_id:"light.flur",room:"Flur",name:"Licht",icon:"💡",state:"off"}
 ]
};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(seed);
let state={view:"today",modal:null,shopList:"l1",calendarFilter:"all"};

const CLOUD_KEY="familienhub-v3-cloud";
let cloud=JSON.parse(localStorage.getItem(CLOUD_KEY)||"null")||{
  url:"",anonKey:"",accessToken:"",refreshToken:"",userId:"",email:"",
  familyId:"",familyName:"",inviteCode:"",displayName:"",enabled:false,lastSync:""
};
let cloudMembers=[];
let cloudReservations=[];
let cloudPushTimer=null;
let cloudPollingStarted=false;
let syncBusy=false;
let lastSyncSnapshot=null;
const SYNC_COLLECTIONS=["family","events","tasks","shoppingLists","shopping","wishes","occasions","notes","meals"];

function saveCloud(){localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud))}
function authHeaders(extra={}){
  const token=cloud.accessToken||cloud.anonKey;
  return {apikey:cloud.anonKey,Authorization:"Bearer "+token,"Content-Type":"application/json",...extra};
}
async function api(path,opts={}){
  if(!cloud.url) throw new Error("Supabase-URL fehlt.");
  const r=await fetch(cloud.url.replace(/\/$/,"")+path,{...opts,headers:authHeaders(opts.headers||{})});
  const text=await r.text();
  let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
  if(!r.ok)throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||("HTTP "+r.status));
  return data;
}
function setCloudStatus(message,ok=false){
  const e=document.getElementById("cloudStatus");
  if(e)e.innerHTML=`<span class="cloud-dot ${ok?"on":""}"></span>${esc(message)}`;
}
function myCloudMember(){return cloudMembers.find(m=>m.user_id===cloud.userId)}
function myCloudRole(){if(!cloud.enabled||!cloud.familyId)return "local";return myCloudMember()?.role||"guest"}
function roleLabel(r){return ({parent:"Elternteil",child:"Kind",guest:"Gast",local:"Lokal"}[r]||r)}
function roleClass(r){return r==="parent"?"role-parent":r==="child"?"role-child":"role-guest"}
function canManageFamily(){return !cloud.enabled||!cloud.familyId||myCloudRole()==="parent"}
function canEditGeneral(){return !cloud.enabled||!cloud.familyId||["parent","child"].includes(myCloudRole())}
function requireGeneralEdit(){if(canEditGeneral())return true;alert("Dieses Profil ist als Gast nur zum Lesen eingerichtet.");return false}
function requireParent(){if(canManageFamily())return true;alert("Diese Einstellung kann nur von einem Eltern-Profil geändert werden.");return false}

async function cloudSignUp(){
  const u=document.getElementById("cUrl")?.value.trim(),k=document.getElementById("cKey")?.value.trim();
  if(u)cloud.url=u;if(k)cloud.anonKey=k;saveCloud();
  const email=val("cEmail"),password=val("cPassword");if(!email||!password)return alert("E-Mail und Passwort eingeben.");
  try{
    const r=await fetch(cloud.url.replace(/\/$/,"")+"/auth/v1/signup",{method:"POST",headers:{apikey:cloud.anonKey,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||"Registrierung fehlgeschlagen");
    if(d.access_token){cloud.accessToken=d.access_token;cloud.refreshToken=d.refresh_token||"";cloud.userId=d.user?.id||"";cloud.email=email;saveCloud();render()}
    else alert("Konto erstellt. Falls E-Mail-Bestätigung aktiv ist, bestätige zuerst die E-Mail und melde dich danach an.");
  }catch(e){alert(e.message)}
}
async function cloudSignIn(){
  const u=document.getElementById("cUrl")?.value.trim(),k=document.getElementById("cKey")?.value.trim();
  if(u)cloud.url=u;if(k)cloud.anonKey=k;saveCloud();
  const email=val("cEmail"),password=val("cPassword");if(!email||!password)return alert("E-Mail und Passwort eingeben.");
  try{
    const r=await fetch(cloud.url.replace(/\/$/,"")+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:cloud.anonKey,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||"Anmeldung fehlgeschlagen");
    cloud.accessToken=d.access_token;cloud.refreshToken=d.refresh_token||"";cloud.userId=d.user?.id||"";cloud.email=email;cloud.enabled=true;saveCloud();
    await loadCloudMembership();if(cloud.familyId)await initializeRecordSync();startCloudPolling();render();
  }catch(e){alert(e.message)}
}
async function cloudSignOut(){
  try{if(cloud.accessToken)await fetch(cloud.url.replace(/\/$/,"")+"/auth/v1/logout",{method:"POST",headers:authHeaders()})}catch{}
  cloud.accessToken="";cloud.refreshToken="";cloud.userId="";cloud.email="";cloud.familyId="";cloud.familyName="";cloud.inviteCode="";cloud.enabled=false;
  cloudMembers=[];cloudReservations=[];lastSyncSnapshot=null;saveCloud();render();
}
async function cloudCreateFamily(){
  const name=val("cFamilyName"),display=val("cCreateDisplayName");if(!name||!display)return alert("Familienname und dein Anzeigename fehlen.");
  try{
    const d=await api("/rest/v1/rpc/create_family",{method:"POST",body:JSON.stringify({p_name:name,p_display_name:display})}),row=Array.isArray(d)?d[0]:d;
    cloud.familyId=row.family_id;cloud.familyName=row.family_name;cloud.inviteCode=row.invite_code;cloud.displayName=display;cloud.enabled=true;saveCloud();
    await loadCloudMembership();await initializeRecordSync();startCloudPolling();render();
  }catch(e){alert(e.message)}
}
async function cloudJoinFamily(){
  const code=val("cInviteCode").toUpperCase(),display=val("cJoinDisplayName");if(!code||!display)return alert("Einladungscode und Anzeigename fehlen.");
  try{
    const d=await api("/rest/v1/rpc/join_family",{method:"POST",body:JSON.stringify({p_invite_code:code,p_display_name:display})}),row=Array.isArray(d)?d[0]:d;
    cloud.familyId=row.family_id;cloud.familyName=row.family_name;cloud.inviteCode=row.invite_code;cloud.displayName=display;cloud.enabled=true;saveCloud();
    await loadCloudMembership();await initializeRecordSync();startCloudPolling();render();
  }catch(e){alert(e.message)}
}
async function loadCloudMembership(){
  if(!cloud.familyId||!cloud.accessToken)return;
  try{
    cloudMembers=await api(`/rest/v1/family_members?family_id=eq.${cloud.familyId}&select=user_id,display_name,role,created_at&order=created_at.asc`);
    const me=myCloudMember();if(me)cloud.displayName=me.display_name;await loadReservations();saveCloud();
  }catch(e){console.warn(e)}
}

function cleanSyncItem(collection,item){
  const c=structuredClone(item);delete c._cloudUpdatedAt;
  if(collection==="wishes"){c.reserved=false;c.reservedBy=null}
  return c;
}
function syncSnapshot(){
  const snap={};
  for(const c of SYNC_COLLECTIONS){snap[c]={};for(const item of (db[c]||[])){if(item?.id)snap[c][String(item.id)]=JSON.stringify(cleanSyncItem(c,item))}}
  return snap;
}
function buildAllRecordRows(){
  const rows=[];for(const c of SYNC_COLLECTIONS)for(const item of (db[c]||[]))if(item?.id)rows.push({family_id:cloud.familyId,collection:c,record_id:String(item.id),data:cleanSyncItem(c,item),deleted:false});
  return rows;
}
function changedRecordRows(){
  if(!lastSyncSnapshot)return buildAllRecordRows();
  const now=syncSnapshot(),rows=[];
  for(const c of SYNC_COLLECTIONS){
    const prev=lastSyncSnapshot[c]||{},cur=now[c]||{};
    for(const [id,j] of Object.entries(cur))if(prev[id]!==j)rows.push({family_id:cloud.familyId,collection:c,record_id:id,data:JSON.parse(j),deleted:false});
    for(const id of Object.keys(prev))if(!(id in cur))rows.push({family_id:cloud.familyId,collection:c,record_id:id,data:{},deleted:true});
  }
  return rows;
}
async function postRecordRows(rows){
  if(!rows.length)return;
  await api("/rest/v1/family_records?on_conflict=family_id,collection,record_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
}
function applyRemoteRows(rows){
  for(const c of SYNC_COLLECTIONS){
    const relevant=rows.filter(r=>r.collection===c);if(!relevant.length)continue;
    const byId=new Map(relevant.map(r=>[String(r.record_id),r])),merged=[];
    for(const local of (db[c]||[])){const r=byId.get(String(local.id));if(!r)continue;if(!r.deleted)merged.push(r.data);byId.delete(String(local.id))}
    for(const r of byId.values())if(!r.deleted)merged.push(r.data);
    db[c]=merged;
  }
  localStorage.setItem(KEY,JSON.stringify(db));
}
async function migrateLegacyStateIfNeeded(){
  const existing=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=record_id&limit=1`);if(existing?.length)return;
  const legacy=await api(`/rest/v1/family_state?family_id=eq.${cloud.familyId}&select=data`);
  if(legacy?.length&&legacy[0].data&&Object.keys(legacy[0].data).length){
    db={...db,...legacy[0].data};localStorage.setItem(KEY,JSON.stringify(db));
    if(canEditGeneral())await postRecordRows(buildAllRecordRows());
  }else if(canManageFamily())await postRecordRows(buildAllRecordRows());
}
async function initializeRecordSync(){
  if(!cloud.enabled||!cloud.familyId||!cloud.accessToken)return;
  try{
    await migrateLegacyStateIfNeeded();
    const rows=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=collection,record_id,data,updated_at,deleted&order=updated_at.asc`);
    if(rows?.length)applyRemoteRows(rows);
    lastSyncSnapshot=syncSnapshot();cloud.lastSync=new Date().toISOString();saveCloud();setCloudStatus("Synchronisiert · Einzel-Einträge",true);
  }catch(e){setCloudStatus("Sync-Setup: "+e.message,false)}
}
async function recordPushInternal(){const rows=changedRecordRows();if(rows.length){await postRecordRows(rows);lastSyncSnapshot=syncSnapshot()}}
async function recordPullInternal(){
  const rows=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=collection,record_id,data,updated_at,deleted&order=updated_at.asc`);
  if(rows?.length)applyRemoteRows(rows);lastSyncSnapshot=syncSnapshot();await loadReservations();
}
async function cloudSyncCycle(silent=false){
  if(syncBusy||!cloud.enabled||!cloud.familyId||!cloud.accessToken)return;syncBusy=true;
  try{await recordPushInternal();await recordPullInternal();cloud.lastSync=new Date().toISOString();saveCloud();setCloudStatus("Synchronisiert · Einzel-Einträge",true);if(!silent)render()}
  catch(e){setCloudStatus("Sync-Fehler: "+e.message,false);if(!silent)alert("Synchronisierung fehlgeschlagen: "+e.message)}
  finally{syncBusy=false}
}
async function cloudPush(){return cloudSyncCycle(false)}
async function cloudPull(silent=false){return cloudSyncCycle(silent)}
function scheduleCloudPush(){if(!cloud.enabled||!cloud.familyId)return;clearTimeout(cloudPushTimer);cloudPushTimer=setTimeout(()=>cloudSyncCycle(true),700)}
function startCloudPolling(){if(cloudPollingStarted)return;cloudPollingStarted=true;setInterval(()=>{if(cloud.enabled&&cloud.familyId)cloudSyncCycle(true).then(()=>{if(!["cloud","roles"].includes(state.view))render()})},6000)}

async function loadReservations(){
  if(!cloud.familyId||!cloud.accessToken)return;
  try{cloudReservations=await api(`/rest/v1/wish_reservations?family_id=eq.${cloud.familyId}&select=wish_id,reserved_by,owner_user_id,created_at`)}catch(e){cloudReservations=[]}
}
function ownerUserIdForWish(w){return cloudMembers.find(x=>x.display_name===w.owner)?.user_id||null}
function reservationFor(wishId){return cloudReservations.find(r=>r.wish_id===wishId)}
async function toggleCloudWish(w){
  if(!requireGeneralEdit())return;
  const existing=reservationFor(w.id);
  try{
    if(existing){if(existing.reserved_by!==cloud.userId)return alert("Dieses Geschenk wurde bereits von jemand anderem reserviert.");await api(`/rest/v1/wish_reservations?family_id=eq.${cloud.familyId}&wish_id=eq.${encodeURIComponent(w.id)}&reserved_by=eq.${cloud.userId}`,{method:"DELETE"})}
    else{const owner=ownerUserIdForWish(w);if(owner&&owner===cloud.userId)return alert("Eigene Wünsche können nicht reserviert werden.");await api("/rest/v1/wish_reservations",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({family_id:cloud.familyId,wish_id:w.id,reserved_by:cloud.userId,owner_user_id:owner})})}
    await loadReservations();render();
  }catch(e){alert(e.message)}
}
async function setMemberRole(userId,newRole){
  if(!requireParent())return;
  try{await api("/rest/v1/rpc/set_member_role",{method:"POST",body:JSON.stringify({p_family_id:cloud.familyId,p_user_id:userId,p_role:newRole})});await loadCloudMembership();render()}
  catch(e){alert("Rolle konnte nicht geändert werden: "+e.message)}
}

function ensureCalendarOwners(){
  db.events = db.events.map(e=>{
    if(e.calendarOwner) return e;
    if(e.person==="Alle") return {...e,calendarOwner:"family"};
    const p=db.family.find(x=>x.name===e.person);
    return {...e,calendarOwner:p?.id||"family"};
  });
}
ensureCalendarOwners();

const save=()=>{
  localStorage.setItem(KEY,JSON.stringify(db));
  scheduleCloudPush();
};
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const person=n=>db.family.find(p=>p.name===n);
function avatar(n,sm=false){const p=person(n)||{name:n||"?",photo:"",tone:"#9b78a6"};return p.photo?`<img class="avatar ${sm?"sm":""}" src="${p.photo}" alt="${esc(p.name)}">`:`<div class="avatar ${sm?"sm":""}" style="background:${p.tone}">${esc((p.name||"?")[0])}</div>`}

function calendarName(ownerId){
  if(ownerId==="family") return "Familie";
  return db.family.find(p=>p.id===ownerId)?.name || "Familie";
}
function calendarColor(ownerId){
  if(ownerId==="family") return "#b56e52";
  return db.family.find(p=>p.id===ownerId)?.tone || "#9b78a6";
}
function calendarAvatar(ownerId){
  if(ownerId==="family") return `<div class="avatar sm" style="background:#b56e52">♥</div>`;
  const p=db.family.find(x=>x.id===ownerId);
  return p ? avatar(p.name,true) : `<div class="avatar sm">?</div>`;
}
function eventOwnerBadge(e){
  const name=calendarName(e.calendarOwner);
  const color=calendarColor(e.calendarOwner);
  return `<span class="badge" style="background:${color}18;color:${color};border:1px solid ${color}35">${esc(name)}</span>`;
}

function fmtDate(s){return new Date(s+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"short"})}
function repeatLabel(r){return ({none:"einmalig",daily:"täglich",weekly:"wöchentlich",monthly:"monatlich"}[r]||r)}
function shell(content){return `<div class="app"><header><div class="brand"><div class="logo">♥</div><div><h1>FamilienHub</h1><div class="small">Gemeinsam organisiert · v5</div></div></div><div class="avatars">${db.family.map(p=>avatar(p.name)).join("")}</div></header>${content}${nav()}</div>${state.modal?modalHTML():""}`}
function nav(){const xs=[["today","⌂","Heute"],["calendar","◫","Kalender"],["tasks","✓","Aufgaben"],["shopping","🛒","Einkauf"],["wishes","🎁","Wünsche"],["more","•••","Mehr"]];return `<nav class="bottom">${xs.map(x=>`<button class="nav ${state.view===x[0]?"active":""}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join("")}</nav>`}
function go(v){state.view=v;state.modal=null;render()}
function taskRow(t){return `<div class="row"><button class="check ${t.done?"done":""}" onclick="toggleTask('${t.id}')">${t.done?"✓":""}</button><div class="priority ${t.prio}"></div><div class="grow"><div class="title">${esc(t.title)}</div><div class="meta">${fmtDate(t.due)} ${esc(t.time)} · ${esc(t.who)} · ${repeatLabel(t.repeat)}${t.completedAt?` · erledigt ${new Date(t.completedAt).toLocaleString("de-DE")}`:""}</div></div>${avatar(t.who,true)}</div>`}
function shopRow(s){return `<div class="row"><button class="check ${s.done?"done":""}" onclick="toggleShop('${s.id}')">${s.done?"✓":""}</button><div class="grow"><div class="title">${esc(s.name)} <span class="muted">${esc(s.qty)}</span></div><div class="meta">${esc(s.cat)} · von ${esc(s.by)}</div></div>${avatar(s.by,true)}</div>`}
function deviceCard(d,real=false){const on=["on","open","opening"].includes(d.state);return `<div class="device"><span style="font-size:24px">${d.icon||"⌁"}</span><div><div class="title">${esc(d.name||d.entity_id)}</div><div class="meta">${esc(d.room||d.entity_id)} · ${esc(d.state)}</div></div><div class="sw ${on?"on":""}" onclick="${real?`haToggle('${d.entity_id}','${d.state}')`:`toggleDemo('${d.id}')`}"><i></i></div></div>`}

function cloudView(){
 const logged=!!cloud.accessToken,joined=!!cloud.familyId,parent=canManageFamily(),role=myCloudRole();
 return `<div class="section-title"><div><h2>Familien-Synchronisierung</h2><div class="small">v5 synchronisiert einzelne Termine, Aufgaben und Listen statt den kompletten Familienstand.</div></div></div><div class="grid">${(!joined||parent)?`<section class="card s6"><h3>☁️ Supabase-Verbindung</h3><div class="form"><div class="full"><label>Project URL</label><input id="cUrl" value="${esc(cloud.url)}" placeholder="https://xxxx.supabase.co" onchange="cloud.url=this.value.trim();saveCloud()"></div><div class="full"><label>Publishable Key</label><input id="cKey" type="password" value="${esc(cloud.anonKey)}" onchange="cloud.anonKey=this.value.trim();saveCloud()"></div></div></section>`:`<section class="card s6 locked-card"><h3>🔒 Supabase-Verbindung</h3><div class="notice">Cloud-Verbindungsdaten sind für ${roleLabel(role)}-Profile gesperrt.</div></section>`}<section class="card s6"><h3>👤 Konto</h3><div id="cloudStatus" class="cloud-status"><span class="cloud-dot ${logged?"on":""}"></span>${logged?`Angemeldet als ${esc(cloud.email)} · ${roleLabel(role)}`:"Nicht angemeldet"}</div>${!logged?`<div class="form" style="margin-top:10px"><div class="full"><label>E-Mail</label><input id="cEmail" type="email"></div><div class="full"><label>Passwort</label><input id="cPassword" type="password"></div></div><div class="toolbar" style="margin-top:10px"><button class="primary" onclick="cloudSignIn()">Anmelden</button><button class="ghost" onclick="cloudSignUp()">Konto erstellen</button></div>`:`<div class="toolbar" style="margin-top:10px"><button class="ghost" onclick="cloudSignOut()">Abmelden</button></div>`}</section>${logged&&!joined?`<section class="card s6"><h3>🏡 Neue Familie</h3><div class="form"><div class="full"><label>Familienname</label><input id="cFamilyName"></div><div class="full"><label>Dein Name in der App</label><input id="cCreateDisplayName"></div></div><button class="primary" style="margin-top:10px" onclick="cloudCreateFamily()">Familie anlegen</button></section><section class="card s6"><h3>✉️ Familie beitreten</h3><div class="form"><div class="full"><label>Einladungscode</label><input id="cInviteCode"></div><div class="full"><label>Dein Name in der App</label><input id="cJoinDisplayName"></div></div><button class="primary" style="margin-top:10px" onclick="cloudJoinFamily()">Beitreten</button></section>`:""}${joined?`<section class="card s12"><h3>👨‍👩‍👧‍👦 ${esc(cloud.familyName||"Familie")}</h3><div class="row"><div class="grow"><div class="title">Einladungscode</div><div class="meta">Neue Mitglieder starten als Gast; ein Elternteil kann die Rolle danach ändern.</div></div><div class="pill">${esc(cloud.inviteCode)}</div></div><div class="row"><div class="grow"><div class="title">Einzel-Eintrag-Synchronisierung</div><div class="meta">Parallele Änderungen an unterschiedlichen Einträgen überschreiben sich nicht mehr gegenseitig.</div></div><button class="primary" onclick="cloudPush()">Jetzt synchronisieren</button></div><div class="sync-log">Letzter Sync: ${cloud.lastSync?new Date(cloud.lastSync).toLocaleString("de-DE"):"noch keiner"}</div></section>`:""}</div>`;
}

function backupView(){return `<div class="section-title"><h2>Datensicherung</h2></div><section class="card s12"><h3>💾 Backup</h3><div class="toolbar"><button class="primary" onclick="exportJSON()">Daten exportieren</button><button class="ghost" onclick="document.getElementById('importFile').click()">Backup importieren</button><button class="danger" onclick="resetDemo()">Demo zurücksetzen</button></div><input id="importFile" type="file" accept="application/json" hidden onchange="importJSON(event)"><div class="notice" style="margin-top:12px">Damit kannst du deine lokalen Daten zwischen Browsern manuell übertragen.</div></section>`}
function render(){const m={today:todayView,calendar:calendarView,tasks:tasksView,shopping:shoppingView,wishes:wishesView,more:moreView,occasions:occasionsView,notes:notesView,family:familyView,meals:mealsView,home:homeView,backup:backupView,roles:rolesView,cloud:cloudView,install:installView};document.getElementById("root").innerHTML=shell((m[state.view]||todayView)());checkReminders()}
function removeItem(k,id){if(!requireGeneralEdit())return;db[k]=db[k].filter(x=>x.id!==id);save();render()}
function toggleShop(id){if(!requireGeneralEdit())return;const s=db.shopping.find(x=>x.id===id);s.done=!s.done;save();render()}
function toggleWish(id){if(!requireGeneralEdit())return;const w=db.wishes.find(x=>x.id===id);w.reserved=!w.reserved;w.reservedBy=w.reserved?db.settings.currentUser:null;save();render()}
function toggleDemo(id){if(!requireGeneralEdit())return;const d=db.demoDevices.find(x=>x.id===id);d.state=(d.state==="on"?"off":"on");save();render()}
function toggleTask(id){if(!requireGeneralEdit())return;const t=db.tasks.find(x=>x.id===id);if(!t.done){t.done=true;t.completedAt=new Date().toISOString();if(t.repeat!=="none"){const nd=new Date(t.due+"T12:00");if(t.repeat==="daily")nd.setDate(nd.getDate()+1);if(t.repeat==="weekly")nd.setDate(nd.getDate()+7);if(t.repeat==="monthly")nd.setMonth(nd.getMonth()+1);db.tasks.push({...t,id:"t"+Date.now(),due:nd.toISOString().slice(0,10),done:false,completedAt:null})}}else{t.done=false;t.completedAt=null}save();render()}
function openModal(t){state.modal={type:t};render()}function closeModal(){state.modal=null;render()}
function peopleOptions(){return db.family.map(p=>`<option>${esc(p.name)}</option>`).join("")}
function listOptions(){return db.shoppingLists.map(l=>`<option value="${l.id}" ${state.shopList===l.id?"selected":""}>${esc(l.name)}</option>`).join("")}
function modalHTML(){const t=state.modal.type, f={
event:`<div class="full"><label>Titel</label><input id="fTitle"></div><div><label>Datum</label><input id="fDate" type="date" value="${todayISO()}"></div><div><label>Zeit</label><input id="fTime" type="time" value="18:00"></div><div><label>Kalender</label><select id="fCalendar"><option value="family">♥ Familienkalender</option>${db.family.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div><div><label>Ort</label><input id="fPlace"></div>`,
task:`<div class="full"><label>Aufgabe</label><input id="fTitle"></div><div><label>Fällig</label><input id="fDate" type="date" value="${todayISO()}"></div><div><label>Zeit</label><input id="fTime" type="time" value="18:00"></div><div><label>Zuständig</label><select id="fPerson">${peopleOptions()}</select></div><div><label>Priorität</label><select id="fPrio"><option value="low">Normal</option><option value="med">Wichtig</option><option value="high">Dringend</option></select></div><div><label>Wiederholung</label><select id="fRepeat"><option value="none">Einmalig</option><option value="daily">Täglich</option><option value="weekly">Wöchentlich</option><option value="monthly">Monatlich</option></select></div>`,
shop:`<div class="full"><label>Artikel</label><input id="fTitle"></div><div><label>Liste</label><select id="fList">${listOptions()}</select></div><div><label>Menge</label><input id="fQty"></div><div><label>Kategorie</label><input id="fCat" placeholder="z.B. Backwaren"></div><div><label>Von</label><select id="fPerson">${peopleOptions()}</select></div>`,
shoppingList:`<div class="full"><label>Name der Liste</label><input id="fTitle" placeholder="z.B. Apotheke"></div><div><label>Emoji</label><input id="fIcon" value="🛍️"></div>`,
wish:`<div class="full"><label>Wunsch</label><input id="fTitle"></div><div><label>Für wen?</label><select id="fPerson">${peopleOptions()}</select></div><div class="full"><label>Notiz</label><textarea id="fNote"></textarea></div><div class="full"><label>Link optional</label><input id="fUrl" type="url"></div>`,
occasion:`<div class="full"><label>Anlass</label><input id="fTitle"></div><div><label>Datum</label><input id="fDate" type="date" value="${plusDays(30)}"></div><div><label>Art</label><select id="fKind"><option>Geburtstag</option><option>Jahrestag</option><option>Feiertag</option><option>Sonstiges</option></select></div><div><label>Erinnerung Tage vorher</label><input id="fRemind" type="number" value="7"></div>`,
note:`<div class="full"><label>Notiz</label><textarea id="fTitle"></textarea></div><div><label>Von</label><select id="fPerson">${peopleOptions()}</select></div>`,
person:`<div><label>Name</label><input id="fTitle"></div><div><label>Rolle</label><select id="fRole"><option>Elternteil</option><option>Kind</option><option>Gast</option></select></div>`,
meal:`<div><label>Tag</label><input id="fDay" placeholder="z.B. Samstag"></div><div><label>Gericht</label><input id="fTitle"></div>`
}[t];return `<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Hinzufügen</h3><div class="form">${f}</div><div class="actions"><button class="ghost" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveModal('${t}')">Speichern</button></div></div></div>`}
const val=id=>document.getElementById(id)?.value?.trim()||"";
function saveModal(t){if(t==="person"){if(!requireParent())return}else if(!requireGeneralEdit())return;const title=val("fTitle"),id=t[0]+Date.now();if(!title)return;if(t==="event"){const owner=val("fCalendar")||"family";db.events.push({id,title,date:val("fDate"),time:val("fTime"),calendarOwner:owner,person:calendarName(owner)==="Familie"?"Alle":calendarName(owner),place:val("fPlace")});}if(t==="task")db.tasks.push({id,title,due:val("fDate"),time:val("fTime"),who:val("fPerson"),prio:val("fPrio"),repeat:val("fRepeat"),done:false,completedAt:null});if(t==="shop")db.shopping.push({id,listId:val("fList"),name:title,qty:val("fQty"),cat:val("fCat")||"Sonstiges",by:val("fPerson"),done:false});if(t==="shoppingList"){const lid="l"+Date.now();db.shoppingLists.push({id:lid,name:title,icon:val("fIcon")||"🛍️"});state.shopList=lid}if(t==="wish")db.wishes.push({id,owner:val("fPerson"),title,note:val("fNote"),url:val("fUrl"),reserved:false,reservedBy:null});if(t==="occasion")db.occasions.push({id,title,date:val("fDate"),kind:val("fKind"),remind:Number(val("fRemind")||7)});if(t==="note")db.notes.unshift({id,text:title,author:val("fPerson"),created:new Date().toISOString()});if(t==="person")db.family.push({id,name:title,role:val("fRole"),photo:"",tone:["#b56e52","#6f87a7","#718c70","#b98b56","#9b78a6"][db.family.length%5]});if(t==="meal")db.meals.push({id,day:val("fDay"),title});save();state.modal=null;render()}
let photoPersonId=null;
function editPhoto(id){if(!requireParent())return;photoPersonId=id;document.getElementById("photoPicker").click()}
function savePhoto(ev){
 const file=ev.target.files[0];if(!file||!requireParent())return;
 const reader=new FileReader();
 reader.onload=()=>{const img=new Image();img.onload=()=>{const size=256,canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;const ctx=canvas.getContext("2d"),scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);const p=db.family.find(x=>x.id===photoPersonId);if(p){p.photo=canvas.toDataURL("image/jpeg",.78);save();render()}};img.src=reader.result};reader.readAsDataURL(file)
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download("FamilienHub-Backup.json",JSON.stringify(db,null,2),"application/json")}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert("Backup importiert.")}catch{alert("Ungültige Backup-Datei.")}};r.readAsText(f)}
function exportICS(){let txt="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FamilienHub//DE\r\n";for(const e of db.events){const dt=e.date.replaceAll("-","")+ "T"+e.time.replace(":","")+"00";txt+=`BEGIN:VEVENT\r\nUID:${e.id}@familienhub\r\nDTSTART:${dt}\r\nSUMMARY:${e.title.replaceAll("\n"," ")}\r\nDESCRIPTION:Kalender: ${calendarName(e.calendarOwner)}\r\nLOCATION:${(e.place||"").replaceAll("\n"," ")}\r\nEND:VEVENT\r\n`}txt+="END:VCALENDAR\r\n";download("FamilienHub-Kalender.ics",txt,"text/calendar")}
function resetDemo(){if(confirm("Alle lokalen Daten zurücksetzen?")){localStorage.removeItem(KEY);db=structuredClone(seed);render()}}
async function enableNotifications(){if(!("Notification"in window)){alert("Benachrichtigungen werden von diesem Browser nicht unterstützt.");return}const p=await Notification.requestPermission();db.settings.notifications=p==="granted";save();if(p==="granted")new Notification("FamilienHub",{body:"Erinnerungen sind aktiviert."});render()}
function checkReminders(){if(!db.settings.notifications||!("Notification"in window)||Notification.permission!=="granted")return;const now=new Date();for(const t of db.tasks.filter(x=>!x.done)){const dt=new Date(t.due+"T"+t.time);const diff=dt-now;if(diff>0&&diff<60000&&!sessionStorage.getItem("rem-"+t.id)){new Notification("Aufgabe fällig",{body:t.title+" · "+t.who});sessionStorage.setItem("rem-"+t.id,"1")}}}
async function connectHA(){if(!requireParent())return;const url=document.getElementById("haUrl").value.trim().replace(/\/$/,""),token=document.getElementById("haToken").value.trim();if(!url||!token)return;const box=document.getElementById("haStatus");box.textContent="Verbinde…";try{const r=await fetch(url+"/api/states",{headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);const all=await r.json();const ents=all.filter(x=>["light.","switch.","cover."].some(p=>x.entity_id.startsWith(p))).slice(0,30).map(x=>({entity_id:x.entity_id,name:x.attributes.friendly_name||x.entity_id,room:"Home Assistant",icon:x.entity_id.startsWith("cover.")?"🪟":"💡",state:x.state}));db.ha={url,token,connected:true,entities:ents};save();render()}catch(e){box.textContent="Verbindung fehlgeschlagen: "+e.message}}
function disconnectHA(){if(!requireParent())return;db.ha.connected=false;db.ha.entities=[];save();render()}
async function haToggle(entity,stateNow){if(!requireGeneralEdit()||!db.ha.connected)return;const domain=entity.split(".")[0];let service;if(domain==="cover")service=(stateNow==="open"?"close_cover":"open_cover");else service=(stateNow==="on"?"turn_off":"turn_on");try{await fetch(`${db.ha.url}/api/services/${domain}/${service}`,{method:"POST",headers:{Authorization:"Bearer "+db.ha.token,"Content-Type":"application/json"},body:JSON.stringify({entity_id:entity})});setTimeout(connectHARefresh,500)}catch(e){alert("Schalten fehlgeschlagen: "+e.message)}}
async function connectHARefresh(){try{const r=await fetch(db.ha.url+"/api/states",{headers:{Authorization:"Bearer "+db.ha.token}});const all=await r.json();db.ha.entities=db.ha.entities.map(e=>{const n=all.find(x=>x.entity_id===e.entity_id);return n?{...e,state:n.state}:e});save();render()}catch{}}

if("serviceWorker" in navigator){
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      reg.addEventListener("updatefound",()=>console.log("FamilienHub Update gefunden."));
    }catch(e){console.warn("Service Worker:",e)}
  });
}

window.state=state;
if(cloud.enabled&&cloud.familyId&&cloud.accessToken){loadCloudMembership().then(()=>initializeRecordSync()).then(()=>startCloudPolling())}
render();
</script>
</body>
