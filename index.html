<head>

<title>FamilienHub v8.1</title>
<style>
:root{
  --bg:#f6efe7;--card:#fffaf5;--card2:#f2e7dc;--line:#e6d7ca;--ink:#483d37;--muted:#8e8075;
  --accent:#b56e52;--sage:#718c70;--gold:#d29b56;--red:#b95f59;--blue:#6f87a7;
  --shadow:0 12px 34px rgba(75,53,38,.10);--r:22px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:0 max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;background:rgba(246,239,231,.94);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#d9ad88,#b56e52);display:grid;place-items:center;color:white;font-size:23px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:0}.small,.muted{color:var(--muted);font-size:12px}
.avatars{display:flex;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:3px solid white;margin-left:-6px;background:#b56e52;color:white;display:grid;place-items:center;font-weight:750;box-shadow:0 3px 9px #0001}.avatar.sm{width:30px;height:30px;border-width:2px;margin:0}
.hero{background:linear-gradient(135deg,#fff9f2,#efe0d1);border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:var(--shadow);margin:6px 0 16px}.hero h2{font-size:29px;margin:6px 0}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:0 7px 20px rgba(75,53,38,.05)}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card h3{font-size:17px;margin:0 0 12px}.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #eee2d8}.row:first-of-type{border-top:0}.grow{flex:1;min-width:0}.title{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:3px}.time{color:var(--accent);font-size:12px;font-weight:750;min-width:44px}
.primary,.ghost,.danger,.iconbtn{border:0;border-radius:13px;padding:9px 12px}.primary{background:var(--accent);color:#fff}.ghost{background:#f0e5da;color:var(--ink)}.danger{background:#f4dfdc;color:#9f4e49}.iconbtn{background:#f3e8de}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.section-title{display:flex;align-items:center;justify-content:space-between;margin:5px 0 13px}.section-title h2{margin:0}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #b6a79b;background:#fff}.check.done{background:var(--sage);border-color:var(--sage);color:#fff}.priority{width:7px;height:28px;border-radius:6px;background:#d6c7ba}.priority.med{background:var(--gold)}.priority.high{background:var(--red)}
.notice{padding:11px 13px;border-radius:14px;background:#f0e9df;color:var(--muted);font-size:12px}.success{background:#e6efe5;color:#577057}.warning{background:#f7ecd9;color:#8d6a35}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(780px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:7px;background:rgba(255,250,245,.96);backdrop-filter:blur(15px);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);z-index:30}.nav{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 2px;font-size:10px}.nav b{display:block;font-size:18px;margin-bottom:2px}.nav.active{background:#f0e2d6;color:var(--accent);font-weight:700}
.modalbg{position:fixed;inset:0;background:#2c221c55;z-index:40;display:grid;place-items:end center}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fffaf5;border-radius:28px 28px 0 0;padding:21px;box-shadow:0 -12px 40px #0002}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px;color:var(--ink)}textarea{min-height:82px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.shopping-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.shop-tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.shop-tab.active{background:#f0e2d6;color:var(--accent);border-color:#e2c6b4}.shop-tab .avatar{display:inline-grid;vertical-align:middle;margin-right:5px}
.calendar-list .row{align-items:flex-start}.badge{font-size:11px;border-radius:999px;padding:4px 8px;background:#f1e6dc;color:var(--muted)}
.person-card{display:flex;align-items:center;gap:13px}.person-card .avatar{width:54px;height:54px;margin:0}.person-actions{margin-left:auto}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.device{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;align-items:center;gap:9px}.sw{margin-left:auto;width:42px;height:24px;border-radius:999px;background:#d8cec6;padding:3px}.sw i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--sage)}.sw.on i{transform:translateX(18px)}
.photo-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#eee;border:2px solid #fff;box-shadow:0 3px 12px #0001}
.kpi{font-size:26px;font-weight:800}.kpi-label{font-size:12px;color:var(--muted)}
.cloud-status{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:14px;background:#f0e9df;font-size:12px;color:var(--muted)}
.cloud-dot{width:9px;height:9px;border-radius:50%;background:#b9aaa0}.cloud-dot.on{background:var(--sage)}
.codebox{background:#3e3733;color:#fff8f1;border-radius:15px;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow:auto}
.sync-log{font-size:11px;color:var(--muted);margin-top:7px}
.role-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;background:#f1e6dc;color:var(--muted)}
.role-parent{background:#e5eee3;color:#557054}.role-child{background:#e7edf4;color:#60758f}.role-guest{background:#eee8e3;color:#81736a}
.member-line{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #eee2d8}.member-line:first-child{border-top:0}
.locked-card{opacity:.78}
.inbox-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{border:0;border-radius:10px;padding:6px 9px;background:#f0e5da;color:var(--ink);font-size:11px}
.house-status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;background:#edf0e7;color:#65725c}
.house-status.due{background:#f5e3df;color:#9c554f}
.house-status.soon{background:#f7ecd9;color:#8d6a35}
.reminder-time{min-width:82px;font-size:11px;color:var(--accent);font-weight:700}
.reminder-icon{width:34px;height:34px;border-radius:12px;background:#f0e5da;display:grid;place-items:center;font-size:17px}
.ingredients{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.meal-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.hero-edit{border:0;background:#ffffffaa;border-radius:12px;padding:8px 10px;color:var(--accent)}
.quick-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:0 0 16px}
.quick-action{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 5px 14px rgba(75,53,38,.04);color:var(--ink)}
.quick-action b{display:block;font-size:20px;margin-bottom:5px}
.card-link{border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:700;padding:4px}
.note-preview{cursor:pointer;transition:transform .12s ease,background .12s ease}
.note-preview:hover{transform:translateY(-1px);background:#fffdf9}
.note-body-preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-category{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;background:#f0e5da;color:var(--muted);margin-right:6px}
.detail-sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fffaf5;border-radius:28px 28px 0 0;padding:22px;box-shadow:0 -12px 40px #0002}
.detail-title{font-size:24px;font-weight:800;margin:4px 0 8px}
.detail-body{font-size:15px;line-height:1.6;white-space:pre-wrap;margin:16px 0}
.reactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.react{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px}
.react.active{background:#f0e2d6;border-color:#e2c6b4}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(max-width:760px){.quick-actions{grid-template-columns:repeat(3,1fr)}}
.click-row{cursor:pointer;transition:background .12s ease,transform .12s ease}
.click-row:hover{background:#fffdf9;transform:translateY(-1px)}
.chev{font-size:20px;color:#b7a79c;padding-left:4px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:92px;z-index:35;width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 12px 28px rgba(93,57,41,.25)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.detail-box{background:#f6eee6;border-radius:14px;padding:11px}
.detail-box .meta{margin-bottom:3px}
.qty-control{display:inline-flex;align-items:center;gap:10px;background:#f0e5da;border-radius:999px;padding:5px}
.qty-control button{width:30px;height:30px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:19px}
.quick-sheet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.quick-sheet-btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;text-align:left;color:var(--ink)}
.quick-sheet-btn b{display:block;font-size:22px;margin-bottom:4px}
@media(max-width:760px){.detail-grid{grid-template-columns:1fr}.fab{bottom:88px}}
.activity-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #eee2d8}
.activity-row:first-child{border-top:0}
.activity-text{font-size:13px;line-height:1.45}
.activity-time{font-size:10px;color:var(--muted);margin-top:3px}
.comment{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:9px}
.comment-head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.comment-body{font-size:13px;line-height:1.5;white-space:pre-wrap}
.comment-compose{display:flex;gap:8px;margin-top:12px}
.comment-compose input{flex:1}
.dash-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #eee2d8}
.dash-row:first-child{border-top:0}
.dash-move{display:flex;gap:5px}
.dash-move button{border:0;background:#f0e5da;border-radius:9px;padding:6px 9px}
.visibility{border:0;border-radius:999px;padding:6px 10px;background:#e6efe5;color:#587057}
.visibility.off{background:#eee8e3;color:#8b7d73}
.hero-buttons{display:flex;gap:7px;flex-wrap:wrap}
.media-picker{border:1px dashed #d8c7ba;border-radius:16px;padding:13px;background:#fffaf6}
.media-help{font-size:11px;color:var(--muted);margin-top:6px}
.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.media-card{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#f7efe8;min-height:90px}
.media-card img{display:block;width:100%;height:190px;object-fit:cover}
.media-file{display:flex;align-items:center;gap:10px;padding:15px;min-height:90px}
.media-file-icon{font-size:30px}
.media-card-actions{position:absolute;right:7px;top:7px;display:flex;gap:5px}
.media-card-actions button{border:0;border-radius:999px;padding:6px 9px;background:#ffffffdd;box-shadow:0 2px 8px #0002}
.person-toolbar{display:flex;gap:7px;flex-wrap:wrap}
.person-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.danger-soft{border:1px solid #e1c3bd;background:#fff7f5;color:#a55348;border-radius:12px;padding:8px 10px}
.uploading{opacity:.65;pointer-events:none}
@media(max-width:620px){.media-grid{grid-template-columns:1fr}.media-card img{height:220px}}





.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi-box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}

.pwa-install-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px}
@media(max-width:760px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.form{grid-template-columns:1fr}.full{grid-column:auto}.homegrid{grid-template-columns:1fr}.hero h2{font-size:25px}.brand .small{display:none}}
</style>

<body>
<div id="root"></div>
<script>
const KEY="familienhub-v3-data";
const todayISO=()=>new Date().toISOString().slice(0,10);
const plusDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const seed={
 family:[
  {id:"p1",name:"Papa",role:"Elternteil",photo:"",tone:"#b56e52"},
  {id:"p2",name:"Mama",role:"Elternteil",photo:"",tone:"#6f87a7"},
  {id:"p3",name:"Lina",role:"Kind",photo:"",tone:"#718c70"},
  {id:"p4",name:"Noah",role:"Kind",photo:"",tone:"#b98b56"}
 ],
 events:[
  {id:"e1",title:"Schule",date:todayISO(),time:"08:00",person:"Lina",place:""},
  {id:"e2",title:"Zahnarzt",date:todayISO(),time:"15:30",person:"Mama",place:"Praxis"},
  {id:"e3",title:"Familienabend",date:todayISO(),time:"18:00",person:"Alle",place:"Zuhause"},
  {id:"e4",title:"Fußballtraining",date:plusDays(2),time:"17:00",person:"Noah",place:"Sportplatz"}
 ],
 tasks:[
  {id:"t1",title:"Mülltonne rausstellen",due:todayISO(),time:"19:00",who:"Papa",prio:"med",repeat:"weekly",done:false,completedAt:null},
  {id:"t2",title:"Paket abholen",due:todayISO(),time:"17:30",who:"Mama",prio:"high",repeat:"none",done:false,completedAt:null},
  {id:"t3",title:"Pflanzen gießen",due:plusDays(1),time:"18:00",who:"Lina",prio:"low",repeat:"weekly",done:false,completedAt:null}
 ],
 shoppingLists:[
  {id:"l1",name:"Lebensmittel",icon:"🛒"},
  {id:"l2",name:"Drogerie",icon:"🧴"},
  {id:"l3",name:"Baumarkt",icon:"🔨"}
 ],
 shopping:[
  {id:"s1",listId:"l1",name:"Milch",qty:"2×",cat:"Milchprodukte",by:"Mama",done:false},
  {id:"s2",listId:"l1",name:"Brot",qty:"1×",cat:"Backwaren",by:"Papa",done:false},
  {id:"s3",listId:"l2",name:"Waschmittel",qty:"1×",cat:"Haushalt",by:"Mama",done:false},
  {id:"s4",listId:"l3",name:"8-mm-Dübel",qty:"1 Pack",cat:"Befestigung",by:"Papa",done:false}
 ],
 wishes:[
  {id:"w1",owner:"Lina",title:"Kopfhörer",note:"am liebsten beige",url:"",reserved:false,reservedBy:null},
  {id:"w2",owner:"Noah",title:"Lego-Set",note:"Weltraum",url:"",reserved:true,reservedBy:"Papa"},
  {id:"w3",owner:"Mama",title:"Italienisches Kochbuch",note:"",url:"",reserved:false,reservedBy:null}
 ],
 occasions:[
  {id:"o1",title:"Geburtstag Lina",date:plusDays(38),kind:"Geburtstag",remind:14},
  {id:"o2",title:"Hochzeitstag",date:plusDays(95),kind:"Jahrestag",remind:7}
 ],
 notes:[
  {id:"n1",text:"Samstag 14 Uhr: gemeinsam Kuchen backen 🍰",author:"Mama",created:new Date().toISOString()},
  {id:"n2",text:"Bitte Schulsachen für Montag prüfen.",author:"Papa",created:new Date().toISOString()}
 ],
 meals:[
  {id:"m1",day:"Heute",title:"Pasta mit Tomatensoße"},
  {id:"m2",day:"Morgen",title:"Ofengemüse & Feta"},
  {id:"m3",day:"Freitag",title:"Selbstgemachte Pizza"}
 ],
 inbox:[
  {id:"i1",text:"Neue Sportschuhe für Noah besorgen",author:"Mama",created:new Date().toISOString()},
  {id:"i2",text:"Termin für Schornsteinfeger prüfen",author:"Papa",created:new Date().toISOString()}
 ],
 houseMaintenance:[
  {id:"hm1",title:"Rauchmelder prüfen",area:"Ganzes Haus",nextDate:plusDays(45),intervalMonths:12,responsible:"Papa",note:"Funktionstest und Batteriestand",lastDone:""},
  {id:"hm2",title:"Heizungswartung",area:"Technik",nextDate:plusDays(90),intervalMonths:12,responsible:"Papa",note:"Fachbetrieb beauftragen",lastDone:""}
 ],
 houseAssets:[
  {id:"ha1",name:"Waschmaschine",location:"Hauswirtschaft",purchaseDate:"",warrantyUntil:"",serial:"",note:""},
  {id:"ha2",name:"Heizung",location:"Technik",purchaseDate:"",warrantyUntil:"",serial:"",note:""}
 ],
 meterReadings:[
  {id:"mr1",kind:"Strom",value:"",unit:"kWh",date:todayISO()}
 ],
 settings:{notifications:false,currentUser:"Papa"},
 ha:{url:"",token:"",connected:false,entities:[]},
 demoDevices:[
  {id:"d1",entity_id:"light.wohnzimmer",room:"Wohnzimmer",name:"Deckenlicht",icon:"💡",state:"on"},
  {id:"d2",entity_id:"cover.wohnzimmer",room:"Wohnzimmer",name:"Rollladen",icon:"🪟",state:"closed"},
  {id:"d3",entity_id:"light.flur",room:"Flur",name:"Licht",icon:"💡",state:"off"}
 ]
};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(seed);
for(const k of ["inbox","houseMaintenance","houseAssets","meterReadings"]){
  if(!Array.isArray(db[k])) db[k]=structuredClone(seed[k]||[]);
}

for(const e of db.events){if(e.remindMinutes===undefined)e.remindMinutes=60}
for(const t of db.tasks){if(t.remindMinutes===undefined)t.remindMinutes=60}
for(const o of db.occasions){if(o.remind===undefined)o.remind=7}
for(const m of db.houseMaintenance){if(m.reminderDays===undefined)m.reminderDays=30}

if(!db.settings.heroTitle) db.settings.heroTitle="Guten Morgen zusammen 👋";
if(!db.settings.heroSubtitle) db.settings.heroSubtitle="Unser Tag auf einen Blick";
for(const e of db.events){if(e.note===undefined)e.note=""}
for(const t of db.tasks){if(t.note===undefined)t.note=""}
for(const s of db.shopping){if(s.note===undefined)s.note=""}

if(!Array.isArray(db.dashboardConfig)||!db.dashboardConfig.length){
  db.dashboardConfig=[{
    id:"main",
    heroTitle:db.settings.heroTitle||"Guten Morgen zusammen 👋",
    heroSubtitle:db.settings.heroSubtitle||"Unser Tag auf einen Blick",
    order:["events","tasks","shopping","notes","meals","inbox","maintenance","activity","home"],
    hidden:[]
  }];
}
if(!Array.isArray(db.activity))db.activity=[];
for(const n of db.notes){
  if(!Array.isArray(n.comments))n.comments=[];
  if(!Array.isArray(n.attachments))n.attachments=[];
}
for(const n of db.notes){
  if(!n.title)n.title=(n.text||"Pinnwand").split("\n")[0].slice(0,70);
  if(!n.body)n.body=n.text||"";
  if(!n.category)n.category="Allgemein";
  if(!n.reactions)n.reactions={};
  if(n.pinned===undefined)n.pinned=false;
}
for(const m of db.meals){
  if(!Array.isArray(m.ingredients)){
    m.ingredients = typeof m.ingredients==="string"
      ? m.ingredients.split(/[\n,]/).map(x=>x.trim()).filter(Boolean)
      : [];
  }
}

let state={view:"today",modal:null,shopList:"l1",calendarFilter:"all",noteDetailId:null,itemDetail:null,quickMenu:false};

const CLOUD_KEY="familienhub-v3-cloud";
let cloud=JSON.parse(localStorage.getItem(CLOUD_KEY)||"null")||{
  url:"",anonKey:"",accessToken:"",refreshToken:"",userId:"",email:"",
  familyId:"",familyName:"",inviteCode:"",displayName:"",enabled:false,lastSync:""
};
let cloudMembers=[];
let cloudReservations=[];
let cloudPushTimer=null;
let cloudPollingStarted=false;
let syncBusy=false;
let lastSyncSnapshot=null;
let passwordRecovery={active:false,accessToken:"",refreshToken:""};

function passwordResetRedirectUrl(){
  const u=new URL(window.location.href);
  u.hash="";
  u.search="";

async function requestPasswordReset(){
  const u=document.getElementById("cUrl")?.value.trim();
  const k=document.getElementById("cKey")?.value.trim();
  if(u)cloud.url=u;
  if(k)cloud.anonKey=k;

  if(!email)return alert("Bitte zuerst deine E-Mail-Adresse eingeben.");
  if(!cloud.url||!cloud.anonKey)return alert("Project URL und Publishable Key fehlen.");

  try{
    const redirectTo=passwordResetRedirectUrl();
    const r=await fetch(
      cloud.url.replace(/\/$/,"")+"/auth/v1/recover?redirect_to="+encodeURIComponent(redirectTo),
      {
        method:"POST",
        headers:{apikey:cloud.anonKey,"Content-Type":"application/json"},
        body:JSON.stringify({email})
      }
    );
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.msg||d.message||d.error_description||"Reset-Mail konnte nicht gesendet werden.");
    alert("Wenn zu dieser E-Mail ein Konto existiert, wurde ein Link zum Zurücksetzen des Passworts gesendet.");
  }catch(e){
    alert("Passwort-Reset fehlgeschlagen: "+e.message);
  }
}

function detectPasswordRecovery(){
  const raw=window.location.hash.replace(/^#/,"");
  if(!raw)return false;
  const p=new URLSearchParams(raw);
  const type=p.get("type");
  const access=p.get("access_token");
  if(type!=="recovery"||!access)return false;

  passwordRecovery={
    active:true,
    accessToken:access,
    refreshToken:p.get("refresh_token")||""
  };

  cloud.accessToken=access;
  cloud.refreshToken=passwordRecovery.refreshToken;
  cloud.enabled=true;
  saveCloud();

  state.view="passwordReset";

  // Recovery-Token nach dem Einlesen aus der sichtbaren URL entfernen.
  history.replaceState(null,"",window.location.pathname+window.location.search);
  return true;
}

async function setRecoveredPassword(){
  const p1=val("newPassword");
  const p2=val("newPassword2");
  if(p1.length<8)return alert("Das neue Passwort muss mindestens 8 Zeichen lang sein.");
  if(p1!==p2)return alert("Die beiden Passwörter stimmen nicht überein.");
  if(!cloud.url||!cloud.anonKey)return alert("Supabase-Verbindung fehlt auf diesem Gerät.");
  const token=passwordRecovery.accessToken||cloud.accessToken;
  if(!token)return alert("Der Wiederherstellungs-Link ist nicht mehr gültig. Fordere bitte einen neuen Link an.");

  try{
    const r=await fetch(cloud.url.replace(/\/$/,"")+"/auth/v1/user",{
      method:"PUT",
      headers:{
        apikey:cloud.anonKey,
        Authorization:"Bearer "+token,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({password:p1})
    });
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.msg||d.message||d.error_description||"Passwort konnte nicht geändert werden.");

    if(d.id)cloud.userId=d.id;
    if(d.email)cloud.email=d.email;
    cloud.enabled=true;
    saveCloud();
    passwordRecovery={active:false,accessToken:"",refreshToken:""};

    await discoverMyFamily();
    if(cloud.familyId){
      await loadCloudMembership();
      await initializeRecordSync();
      startCloudPolling();
    }
    state.view="cloud";
    render();
    alert("Dein Passwort wurde geändert. Du bist wieder angemeldet.");
  }catch(e){
    alert("Passwort konnte nicht geändert werden: "+e.message);
  }
}

const SYNC_COLLECTIONS=["family","events","tasks","shoppingLists","shopping","wishes","occasions","notes","meals","inbox","houseMaintenance","houseAssets","meterReadings","dashboardConfig","activity"];

function saveCloud(){localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud))}
function authHeaders(extra={}){
  const token=cloud.accessToken||cloud.anonKey;
  return {apikey:cloud.anonKey,Authorization:"Bearer "+token,"Content-Type":"application/json",...extra};
}
async function api(path,opts={}){
  if(!cloud.url) throw new Error("Supabase-URL fehlt.");
  const r=await fetch(cloud.url.replace(/\/$/,"")+path,{...opts,headers:authHeaders(opts.headers||{})});
  const text=await r.text();
  let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
  if(!r.ok)throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||("HTTP "+r.status));
  return data;
}

const MEDIA_BUCKET="familienhub-media";
const mediaObjectUrls=new Map();

function safeFileName(name){
  return String(name||"datei")
    .normalize("NFKD").replace(/[^\w.\-]+/g,"-")
    .replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,80)||"datei";
}
function mediaExt(file){
  const n=file.name||"",m=n.match(/\.([a-zA-Z0-9]{1,6})$/);
  if(m)return m[1].toLowerCase();
  if(file.type==="image/jpeg")return "jpg";
  if(file.type==="image/png")return "png";
  if(file.type==="image/webp")return "webp";
  if(file.type==="application/pdf")return "pdf";
  return "bin";
}
async function prepareMediaFile(file){
  if(!file)return null;
  if(file.type==="application/pdf"){
    if(file.size>5*1024*1024)throw new Error(`${file.name}: PDF ist größer als 5 MB.`);
    return {blob:file,type:file.type,name:file.name,ext:"pdf"};
  }
  if(!file.type.startsWith("image/"))throw new Error(`${file.name}: Nur Bilder und PDF werden unterstützt.`);
  const data=await new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
  });
  const img=await new Promise((resolve,reject)=>{
    const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data;
  });
  const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
  canvas.getContext("2d").drawImage(img,0,0,w,h);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.82));
  if(!blob)throw new Error(`${file.name}: Bild konnte nicht verarbeitet werden.`);
  return {blob,type:"image/jpeg",name:file.name.replace(/\.[^.]+$/,"")+".jpg",ext:"jpg"};
}
async function uploadNoteFiles(noteId,files){
  const list=[...(files||[])].slice(0,4);
  if(!list.length)return [];
  if(!cloud.enabled||!cloud.familyId||!cloud.accessToken)
    throw new Error("Bilder/Anhänge benötigen die Familien-Synchronisierung mit Supabase.");
  const uploaded=[];
  for(const original of list){
    const p=await prepareMediaFile(original);
    const objectId=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));
    const path=`${cloud.familyId}/${noteId}/${objectId}.${p.ext}`;
    const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+MEDIA_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/");
    const r=await fetch(url,{
      method:"POST",
      headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken,"Content-Type":p.type,"x-upsert":"false"},
      body:p.blob
    });
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.message||d.error||`${original.name}: Upload fehlgeschlagen (${r.status})`);
    uploaded.push({id:objectId,name:safeFileName(p.name),type:p.type,path,size:p.blob.size});
  }
  return uploaded;
}
async function fetchAttachmentBlob(att){
  const key=att.path;
  if(mediaObjectUrls.has(key))return mediaObjectUrls.get(key);
  if(!cloud.accessToken)throw new Error("Bitte anmelden, um den Anhang zu öffnen.");
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/authenticated/"+MEDIA_BUCKET+"/"+att.path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  if(!r.ok){let d={};try{d=await r.json()}catch{};throw new Error(d.message||`Anhang konnte nicht geladen werden (${r.status})`)}
  const blob=await r.blob(),obj=URL.createObjectURL(blob);
  mediaObjectUrls.set(key,obj);
  return obj;
}

async function deleteStorageObject(path){
  if(!cloud.enabled||!cloud.accessToken||!path)return;
  const url=cloud.url.replace(/\/$/,"")+"/storage/v1/object/"+MEDIA_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/");
  const r=await fetch(url,{method:"DELETE",headers:{apikey:cloud.anonKey,Authorization:"Bearer "+cloud.accessToken}});
  if(!r.ok&&r.status!==404){let d={};try{d=await r.json()}catch{};throw new Error(d.message||"Datei konnte nicht entfernt werden.")}

async function removeNoteAttachment(noteId,attId){
  if(!requireGeneralEdit())return;
  const n=db.notes.find(x=>x.id===noteId),a=n?.attachments?.find(x=>x.id===attId);if(!n||!a)return;
  if(!confirm(`„${a.name}“ von der Pinnwand entfernen?`))return;
  try{await deleteStorageObject(a.path)}catch(e){return alert(e.message)}
  n.attachments=n.attachments.filter(x=>x.id!==attId);
  const old=mediaObjectUrls.get(a.path);if(old){URL.revokeObjectURL(old);mediaObjectUrls.delete(a.path)}
  addActivity("🗑️",`hat einen Anhang von „${n.title}“ entfernt.`,"note",n.id);
  save();render();
}

function cleanSyncItem(collection,item){
  const c=structuredClone(item);delete c._cloudUpdatedAt;
  if(collection==="wishes"){c.reserved=false;c.reservedBy=null}
  return c;
}
function syncSnapshot(){
  const snap={};
  for(const c of SYNC_COLLECTIONS){snap[c]={};for(const item of (db[c]||[])){if(item?.id)snap[c][String(item.id)]=JSON.stringify(cleanSyncItem(c,item))}}
  return snap;
}
function buildAllRecordRows(){
  const rows=[];for(const c of SYNC_COLLECTIONS)for(const item of (db[c]||[]))if(item?.id)rows.push({family_id:cloud.familyId,collection:c,record_id:String(item.id),data:cleanSyncItem(c,item),deleted:false});
  return rows;
}
function changedRecordRows(){
  if(!lastSyncSnapshot)return buildAllRecordRows();
  const now=syncSnapshot(),rows=[];
  for(const c of SYNC_COLLECTIONS){
    const prev=lastSyncSnapshot[c]||{},cur=now[c]||{};
    for(const [id,j] of Object.entries(cur))if(prev[id]!==j)rows.push({family_id:cloud.familyId,collection:c,record_id:id,data:JSON.parse(j),deleted:false});
    for(const id of Object.keys(prev))if(!(id in cur))rows.push({family_id:cloud.familyId,collection:c,record_id:id,data:{},deleted:true});
  }
  return rows;
}
async function postRecordRows(rows){
  if(!rows.length)return;
  await api("/rest/v1/family_records?on_conflict=family_id,collection,record_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
}
function applyRemoteRows(rows){
  for(const c of SYNC_COLLECTIONS){
    const relevant=rows.filter(r=>r.collection===c);if(!relevant.length)continue;
    const byId=new Map(relevant.map(r=>[String(r.record_id),r])),merged=[];
    for(const local of (db[c]||[])){const r=byId.get(String(local.id));if(!r)continue;if(!r.deleted)merged.push(r.data);byId.delete(String(local.id))}
    for(const r of byId.values())if(!r.deleted)merged.push(r.data);
    db[c]=merged;
  }
  localStorage.setItem(KEY,JSON.stringify(db));
}
async function migrateLegacyStateIfNeeded(){
  const existing=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=record_id&limit=1`);if(existing?.length)return;
  const legacy=await api(`/rest/v1/family_state?family_id=eq.${cloud.familyId}&select=data`);
  if(legacy?.length&&legacy[0].data&&Object.keys(legacy[0].data).length){
    db={...db,...legacy[0].data};localStorage.setItem(KEY,JSON.stringify(db));
    if(canEditGeneral())await postRecordRows(buildAllRecordRows());
  }else if(canManageFamily())await postRecordRows(buildAllRecordRows());
}
async function initializeRecordSync(){
  if(!cloud.enabled||!cloud.familyId||!cloud.accessToken)return;
  try{
    await migrateLegacyStateIfNeeded();
    const rows=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=collection,record_id,data,updated_at,deleted&order=updated_at.asc`);
    if(rows?.length)applyRemoteRows(rows);
    lastSyncSnapshot=syncSnapshot();cloud.lastSync=new Date().toISOString();saveCloud();setCloudStatus("Synchronisiert · Einzel-Einträge",true);
  }catch(e){setCloudStatus("Sync-Setup: "+e.message,false)}
}
async function recordPushInternal(){const rows=changedRecordRows();if(rows.length){await postRecordRows(rows);lastSyncSnapshot=syncSnapshot()}}
async function recordPullInternal(){
  const rows=await api(`/rest/v1/family_records?family_id=eq.${cloud.familyId}&select=collection,record_id,data,updated_at,deleted&order=updated_at.asc`);
  if(rows?.length)applyRemoteRows(rows);lastSyncSnapshot=syncSnapshot();await loadReservations();
}
async function cloudSyncCycle(silent=false){
  if(syncBusy||!cloud.enabled||!cloud.familyId||!cloud.accessToken)return;syncBusy=true;
  try{await recordPushInternal();await recordPullInternal();cloud.lastSync=new Date().toISOString();saveCloud();setCloudStatus("Synchronisiert · Einzel-Einträge",true);if(!silent)render()}
  catch(e){setCloudStatus("Sync-Fehler: "+e.message,false);if(!silent)alert("Synchronisierung fehlgeschlagen: "+e.message)}
  finally{syncBusy=false}
}
async function cloudPush(){return cloudSyncCycle(false)}
async function cloudPull(silent=false){return cloudSyncCycle(silent)}
function scheduleCloudPush(){if(!cloud.enabled||!cloud.familyId)return;clearTimeout(cloudPushTimer);cloudPushTimer=setTimeout(()=>cloudSyncCycle(true),700)}
function startCloudPolling(){if(cloudPollingStarted)return;cloudPollingStarted=true;setInterval(()=>{if(cloud.enabled&&cloud.familyId)cloudSyncCycle(true).then(()=>{if(!state.modal&&!["cloud","roles"].includes(state.view))render()})},6000)}

async function loadReservations(){
  if(!cloud.familyId||!cloud.accessToken)return;
  try{cloudReservations=await api(`/rest/v1/wish_reservations?family_id=eq.${cloud.familyId}&select=wish_id,reserved_by,owner_user_id,created_at`)}catch(e){cloudReservations=[]}
}
function ownerUserIdForWish(w){return cloudMembers.find(x=>x.display_name===w.owner)?.user_id||null}
function reservationFor(wishId){return cloudReservations.find(r=>r.wish_id===wishId)}
async function toggleCloudWish(w){
  if(!requireGeneralEdit())return;
  const existing=reservationFor(w.id);
  try{
    if(existing){if(existing.reserved_by!==cloud.userId)return alert("Dieses Geschenk wurde bereits von jemand anderem reserviert.");await api(`/rest/v1/wish_reservations?family_id=eq.${cloud.familyId}&wish_id=eq.${encodeURIComponent(w.id)}&reserved_by=eq.${cloud.userId}`,{method:"DELETE"})}
    else{const owner=ownerUserIdForWish(w);if(owner&&owner===cloud.userId)return alert("Eigene Wünsche können nicht reserviert werden.");await api("/rest/v1/wish_reservations",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({family_id:cloud.familyId,wish_id:w.id,reserved_by:cloud.userId,owner_user_id:owner})})}
    await loadReservations();render();
  }catch(e){alert(e.message)}
}
async function setMemberRole(userId,newRole){
  if(!requireParent())return;
  try{await api("/rest/v1/rpc/set_member_role",{method:"POST",body:JSON.stringify({p_family_id:cloud.familyId,p_user_id:userId,p_role:newRole})});await loadCloudMembership();render()}
  catch(e){alert("Rolle konnte nicht geändert werden: "+e.message)}
}

function ensureCalendarOwners(){
  db.events = db.events.map(e=>{
    if(e.calendarOwner) return e;
    if(e.person==="Alle") return {...e,calendarOwner:"family"};
    const p=db.family.find(x=>x.name===e.person);
    return {...e,calendarOwner:p?.id||"family"};
  });
}
ensureCalendarOwners();

function mealDayOffset(label){
  const raw=String(label||"").trim().toLowerCase();
  if(raw==="heute")return 0;
  if(raw==="morgen")return 1;
  if(raw==="übermorgen"||raw==="uebermorgen")return 2;

  const weekdayMap={
    "sonntag":0,"so":0,
    "montag":1,"mo":1,
    "dienstag":2,"di":2,
    "mittwoch":3,"mi":3,
    "donnerstag":4,"do":4,
    "freitag":5,"fr":5,
    "samstag":6,"sa":6
  };
  const target=weekdayMap[raw];
  if(target===undefined)return 999;
  const now=new Date();
  const current=now.getDay();
  let diff=(target-current+7)%7;
  // Wenn derselbe Wochentag ausgeschrieben ist, ist damit "heute" gemeint.
  return diff;
}
function sortedMeals(){
  return [...db.meals].sort((a,b)=>{
    const da=mealDayOffset(a.day),dbb=mealDayOffset(b.day);
    if(da!==dbb)return da-dbb;
    return String(a.title||"").localeCompare(String(b.title||""),"de");
  });
}


const DASHBOARD_META={
  events:["📅","Heute anstehend"],
  tasks:["✓","Offene Aufgaben"],
  shopping:["🛒","Einkauf"],
  notes:["📌","Pinnwand"],
  meals:["🍲","Essensplan"],

  maintenance:["🛠️","Haus & Wartung"],
  activity:["✨","Familien-Aktivität"],
  home:["🏠","Zuhause"]
};
function dashboardCfg(){
  if(!Array.isArray(db.dashboardConfig)||!db.dashboardConfig.length){
    db.dashboardConfig=[{id:"main",heroTitle:"Guten Morgen zusammen 👋",heroSubtitle:"Unser Tag auf einen Blick",order:Object.keys(DASHBOARD_META),hidden:[]}];
  }
  const c=db.dashboardConfig[0];
  if(!Array.isArray(c.order))c.order=Object.keys(DASHBOARD_META);
  for(const k of Object.keys(DASHBOARD_META))if(!c.order.includes(k))c.order.push(k);
  if(!Array.isArray(c.hidden))c.hidden=[];
  return c;
}
function addActivity(icon,text,kind="",refId=""){
  const by=currentDisplayName();
  db.activity.unshift({id:"a"+Date.now()+"-"+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),by,icon,text,kind,refId});
  if(db.activity.length>120)db.activity=db.activity.slice(0,120);
}
function activityAge(iso){
  const d=new Date(iso),s=Math.max(0,Math.floor((Date.now()-d.getTime())/1000));
  if(s<60)return "gerade eben";
  if(s<3600)return `vor ${Math.floor(s/60)} Min`;
  if(s<86400)return `vor ${Math.floor(s/3600)} Std`;
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"short"});
}
function openActivity(a){
  if(a.kind==="note"&&db.notes.some(x=>x.id===a.refId)){openNote(a.refId);return}
  if(["event","task","shop"].includes(a.kind)){openItemDetail(a.kind,a.refId);return}
  if(a.kind==="meal"){go("meals");return}
  if(a.kind==="maintenance"){go("house");return}
}
function activityRows(limit=6){
  const items=[...db.activity].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,limit);
  return items.map(a=>`<div class="activity-row ${a.kind?"click-row":""}" ${a.kind?`onclick="openActivity(${JSON.stringify(a).replaceAll('"',"&quot;")})"`:""}>
    ${avatar(a.by,true)}
    <div class="grow"><div class="activity-text"><b>${esc(a.by)}</b> ${esc(a.text)}</div><div class="activity-time">${esc(a.icon||"✨")} ${activityAge(a.at)}</div></div>
  </div>`).join("")||'<div class="notice">Noch keine Aktivitäten.</div>';
}

function moveDashboardCard(key,dir){
  if(!requireParent())return;
  const c=dashboardCfg(),i=c.order.indexOf(key),j=i+dir;
  if(i<0||j<0||j>=c.order.length)return;
  [c.order[i],c.order[j]]=[c.order[j],c.order[i]];
  save();render();
}
function toggleDashboardCard(key){
  if(!requireParent())return;
  const c=dashboardCfg();
  c.hidden=c.hidden.includes(key)?c.hidden.filter(x=>x!==key):[...c.hidden,key];
  save();render();
}

function reminderText(minutes){
  const n=Number(minutes||0);
  if(n<=0)return "keine Erinnerung";
  if(n<60)return `${n} Min vorher`;
  if(n===60)return "1 Std vorher";
  if(n<1440)return `${Math.round(n/60)} Std vorher`;
  if(n===1440)return "1 Tag vorher";
  return `${Math.round(n/1440)} Tage vorher`;
}
function reminderDateText(d){
  return d.toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}
function reminderItems(){
  const items=[];
  for(const e of db.events){
    const mins=Number(e.remindMinutes||0);if(mins<=0)continue;
    const due=new Date(`${e.date}T${e.time||"09:00"}`);
    const trigger=new Date(due.getTime()-mins*60000);
    items.push({key:`event-${e.id}-${trigger.getTime()}`,icon:"📅",type:"Termin",title:e.title,meta:`${calendarName(e.calendarOwner)} · ${reminderText(mins)}`,trigger,due});
  }
  for(const t of db.tasks.filter(x=>!x.done)){
    const mins=Number(t.remindMinutes||0);if(mins<=0)continue;
    const due=new Date(`${t.due}T${t.time||"18:00"}`);
    const trigger=new Date(due.getTime()-mins*60000);
    items.push({key:`task-${t.id}-${trigger.getTime()}`,icon:"✓",type:"Aufgabe",title:t.title,meta:`${t.who} · ${reminderText(mins)}`,trigger,due});
  }
  for(const o of db.occasions){
    const days=Number(o.remind||0);if(days<=0)continue;
    const due=new Date(`${o.date}T09:00`);
    const trigger=new Date(due.getTime()-days*86400000);
    items.push({key:`occasion-${o.id}-${trigger.getTime()}`,icon:"🎉",type:o.kind||"Anlass",title:o.title,meta:`${days} Tage vorher`,trigger,due});
  }
  for(const m of db.houseMaintenance){
    const days=Number(m.reminderDays??30);if(days<=0)continue;
    const due=new Date(`${m.nextDate}T09:00`);
    const trigger=new Date(due.getTime()-days*86400000);
    items.push({key:`maint-${m.id}-${trigger.getTime()}`,icon:"🛠️",type:"Wartung",title:m.title,meta:`${m.area} · ${days} Tage vorher`,trigger,due});
  }
  return items.filter(x=>!Number.isNaN(x.trigger.getTime())).sort((a,b)=>a.trigger-b.trigger);
}

function convertInbox(id,type){
 if(!requireGeneralEdit())return;
 const i=db.inbox.find(x=>x.id===id);if(!i)return;
 const nowId=Date.now(),who=currentDisplayName();
 if(type==="task")db.tasks.push({id:"t"+nowId,title:i.text,due:todayISO(),time:"18:00",who:person(who)?who:(db.family[0]?.name||"Alle"),prio:"low",repeat:"none",done:false,completedAt:null});
 if(type==="event")db.events.push({id:"e"+nowId,title:i.text,date:todayISO(),time:"18:00",calendarOwner:"family",person:"Alle",place:""});
 if(type==="shop")db.shopping.push({id:"s"+nowId,listId:state.shopList||db.shoppingLists[0]?.id,name:i.text,qty:"1×",cat:"Sonstiges",by:person(who)?who:(db.family[0]?.name||"Familie"),done:false});

function maintenanceDays(x){
 const a=new Date(todayISO()+"T12:00"),b=new Date(x.nextDate+"T12:00");
 return Math.ceil((b-a)/86400000);
}

 const d=maintenanceDays(x);
 if(d<0)return `<span class="house-status due">${Math.abs(d)} Tage überfällig</span>`;

}

eventEdit:`${(()=>{const e=db.events.find(x=>x.id===state.modal.editId)||{};return `<div class="full"><label>Titel</label><input id="fTitle" value="${esc(e.title||"")}"></div><div><label>Datum</label><input id="fDate" type="date" value="${esc(e.date||todayISO())}"></div><div><label>Zeit</label><input id="fTime" type="time" value="${esc(e.time||"18:00")}"></div><div><label>Kalender</label><select id="fCalendar"><option value="family" ${e.calendarOwner==="family"?"selected":""}>♥ Familienkalender</option>${db.family.map(p=>`<option value="${p.id}" ${e.calendarOwner===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div><label>Ort</label><input id="fPlace" value="${esc(e.place||"")}"></div><div><label>Erinnerung</label><select id="fReminder">${[[0,"Keine"],[10,"10 Min vorher"],[30,"30 Min vorher"],[60,"1 Std vorher"],[1440,"1 Tag vorher"],[10080,"1 Woche vorher"]].map(([v,l])=>`<option value="${v}" ${Number(e.remindMinutes||0)===v?"selected":""}>${l}</option>`).join("")}</select></div><div class="full"><label>Notiz</label><textarea id="fNote">${esc(e.note||"")}</textarea></div>`})()}`,
taskEdit:`${(()=>{const t=db.tasks.find(x=>x.id===state.modal.editId)||{};return `<div class="full"><label>Aufgabe</label><input id="fTitle" value="${esc(t.title||"")}"></div><div><label>Fällig</label><input id="fDate" type="date" value="${esc(t.due||todayISO())}"></div><div><label>Zeit</label><input id="fTime" type="time" value="${esc(t.time||"18:00")}"></div><div><label>Zuständig</label><select id="fPerson">${db.family.map(p=>`<option ${t.who===p.name?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div><label>Priorität</label><select id="fPrio"><option value="low" ${t.prio==="low"?"selected":""}>Normal</option><option value="med" ${t.prio==="med"?"selected":""}>Wichtig</option><option value="high" ${t.prio==="high"?"selected":""}>Dringend</option></select></div><div><label>Wiederholung</label><select id="fRepeat"><option value="none" ${t.repeat==="none"?"selected":""}>Einmalig</option><option value="daily" ${t.repeat==="daily"?"selected":""}>Täglich</option><option value="weekly" ${t.repeat==="weekly"?"selected":""}>Wöchentlich</option><option value="monthly" ${t.repeat==="monthly"?"selected":""}>Monatlich</option></select></div><div><label>Erinnerung</label><select id="fReminder">${[[0,"Keine"],[10,"10 Min vorher"],[30,"30 Min vorher"],[60,"1 Std vorher"],[1440,"1 Tag vorher"]].map(([v,l])=>`<option value="${v}" ${Number(t.remindMinutes||0)===v?"selected":""}>${l}</option>`).join("")}</select></div><div class="full"><label>Notiz</label><textarea id="fNote">${esc(t.note||"")}</textarea></div>`})()}`,
shopEdit:`${(()=>{const s=db.shopping.find(x=>x.id===state.modal.editId)||{};return `<div class="full"><label>Artikel</label><input id="fTitle" value="${esc(s.name||"")}"></div><div><label>Liste</label><select id="fList">${db.shoppingLists.map(l=>`<option value="${l.id}" ${s.listId===l.id?"selected":""}>${esc(l.name)}</option>`).join("")}</select></div><div><label>Menge</label><input id="fQty" value="${esc(s.qty||"")}"></div><div><label>Kategorie</label><input id="fCat" value="${esc(s.cat||"")}"></div><div><label>Von</label><select id="fPerson">${db.family.map(p=>`<option ${s.by===p.name?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div class="full"><label>Notiz</label><textarea id="fNote">${esc(s.note||"")}</textarea></div>`})()}`,
note:`<div class="full"><label>Titel</label><input id="fTitle" placeholder="z. B. Samstag Kuchen backen"></div><div><label>Kategorie</label><select id="fCategory"><option>Allgemein</option><option>Familie</option><option>Schule</option><option>Haus</option><option>Wichtig</option><option>Freizeit</option></select></div><div><label>Von</label><select id="fPerson">${peopleOptions()}</select></div><div class="full"><label>Text</label><textarea id="fBody" placeholder="Hier darf ruhig mehr stehen …"></textarea></div><div class="full media-picker"><label>📷 Bilder / Anhänge</label><input id="fAttachments" type="file" accept="image/*,application/pdf" multiple><div class="media-help">Bis zu 4 Dateien. Bilder werden automatisch verkleinert; PDFs maximal 5 MB.</div></div>`,
noteEdit:`${(()=>{const n=db.notes.find(x=>x.id===state.modal.editId)||{};return `<div class="full"><label>Titel</label><input id="fTitle" value="${esc(n.title||"")}"></div><div><label>Kategorie</label><select id="fCategory">${["Allgemein","Familie","Schule","Haus","Wichtig","Freizeit"].map(c=>`<option ${n.category===c?"selected":""}>${c}</option>`).join("")}</select></div><div><label>Von</label><select id="fPerson">${peopleOptions().replace(`>${esc(n.author)}<`,` selected>${esc(n.author)}<`)}</select></div><div class="full"><label>Text</label><textarea id="fBody">${esc(n.body||n.text||"")}</textarea></div><div class="full media-picker"><label>📎 Weitere Bilder / Anhänge</label><input id="fAttachments" type="file" accept="image/*,application/pdf" multiple><div class="media-help">Vorhandene Anhänge bleiben erhalten. Entfernen kannst du sie in der Detailansicht.</div></div>`})()}`,
person:`<div><label>Name</label><input id="fTitle"></div><div><label>Rolle</label><select id="fRole"><option>Elternteil</option><option>Kind</option><option>Gast</option></select></div>`,
meal:`<div><label>Tag</label><input id="fDay" placeholder="z.B. Samstag"></div><div><label>Gericht</label><input id="fTitle"></div><div class="full"><label>Zutaten</label><textarea id="fIngredients" placeholder="z. B. Nudeln, Tomaten, Parmesan&#10;Mit Komma oder neuer Zeile trennen"></textarea></div>`,
inbox:`<div class="full"><label>Schnellnotiz</label><textarea id="fTitle" placeholder="Was möchtest du später einsortieren?"></textarea></div>`,
maintenance:`<div class="full"><label>Wartung</label><input id="fTitle" placeholder="z. B. Rauchmelder prüfen"></div><div><label>Bereich</label><input id="fArea" placeholder="z. B. Technik"></div><div><label>Nächster Termin</label><input id="fDate" type="date" value="${plusDays(30)}"></div><div><label>Intervall in Monaten</label><input id="fInterval" type="number" min="1" value="12"></div><div><label>Erinnerung Tage vorher</label><input id="fReminderDays" type="number" min="0" value="30"></div><div><label>Zuständig</label><select id="fPerson">${peopleOptions()}</select></div><div class="full"><label>Notiz</label><textarea id="fNote"></textarea></div>`,
asset:`<div class="full"><label>Gerät / Anlage</label><input id="fTitle" placeholder="z. B. Waschmaschine"></div><div><label>Ort</label><input id="fArea" placeholder="Hauswirtschaft"></div><div><label>Kaufdatum</label><input id="fPurchase" type="date"></div><div><label>Garantie bis</label><input id="fWarranty" type="date"></div><div><label>Seriennummer</label><input id="fSerial"></div><div class="full"><label>Notiz</label><textarea id="fNote"></textarea></div>`,
meter:`<div><label>Zähler</label><select id="fKind"><option>Strom</option><option>Gas</option><option>Wasser</option><option>PV</option><option>Sonstiges</option></select></div><div><label>Stand</label><input id="fTitle" inputmode="decimal" placeholder="12345"></div><div><label>Einheit</label><input id="fUnit" value="kWh"></div><div><label>Datum</label><input id="fDate" type="date" value="${todayISO()}"></div>`
}[t];const editing=t.endsWith("Edit");return `<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${editing?"Bearbeiten":"Hinzufügen"}</h3><div class="form">${f}</div><div class="actions"><button class="ghost" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveModal('${t}')">Speichern</button></div></div></div>`}
const val=id=>document.getElementById(id)?.value?.trim()||"";
async function saveModal(t){if(["person","maintenance","asset","meter","hero"].includes(t)){if(!requireParent())return}else if(!requireGeneralEdit())return;const title=val("fTitle"),id=t[0]+Date.now();if(!["hero","noteEdit"].includes(t)&&!title)return;if(t==="event"){const owner=val("fCalendar")||"family";db.events.push({id,title,date:val("fDate"),time:val("fTime"),calendarOwner:owner,person:calendarName(owner)==="Familie"?"Alle":calendarName(owner),place:val("fPlace"),remindMinutes:Number(val("fReminder")||0),note:val("fNote")});}if(t==="task")db.tasks.push({id,title,due:val("fDate"),time:val("fTime"),who:val("fPerson"),prio:val("fPrio"),repeat:val("fRepeat"),remindMinutes:Number(val("fReminder")||0),note:val("fNote"),done:false,completedAt:null});if(t==="shop")db.shopping.push({id,listId:val("fList"),name:title,qty:val("fQty"),cat:val("fCat")||"Sonstiges",by:val("fPerson"),note:val("fNote"),done:false});if(t==="shoppingList"){const lid="l"+Date.now();db.shoppingLists.push({id:lid,name:title,icon:val("fIcon")||"🛍️"});state.shopList=lid}if(t==="wish")db.wishes.push({id,owner:val("fPerson"),title,note:val("fNote"),url:val("fUrl"),reserved:false,reservedBy:null});if(t==="occasion")db.occasions.push({id,title,date:val("fDate"),kind:val("fKind"),remind:Number(val("fRemind")||7)});if(t==="hero"){const c=dashboardCfg();c.heroTitle=val("fHeroTitle")||"FamilienHub";c.heroSubtitle=val("fHeroSubtitle")||"";db.settings.heroTitle=c.heroTitle;db.settings.heroSubtitle=c.heroSubtitle;addActivity("✏️","hat den Begrüßungstext der Startseite geändert.","dashboard","main");}
if(t==="note"){const body=val("fBody");let attachments=[];const files=document.getElementById("fAttachments")?.files;if(files?.length){try{attachments=await uploadNoteFiles(id,files)}catch(e){return alert("Upload fehlgeschlagen: "+e.message)}}db.notes.unshift({id,title,body,text:body,category:val("fCategory")||"Allgemein",author:val("fPerson"),created:new Date().toISOString(),pinned:false,reactions:{},comments:[],attachments});}
if(t==="noteEdit"){const n=db.notes.find(x=>x.id===state.modal.editId);if(n){const files=document.getElementById("fAttachments")?.files;if(files?.length){try{const added=await uploadNoteFiles(n.id,files);n.attachments=[...(n.attachments||[]),...added].slice(0,8)}catch(e){return alert("Upload fehlgeschlagen: "+e.message)}}n.title=val("fTitle")||n.title;n.body=val("fBody");n.text=n.body;n.category=val("fCategory")||"Allgemein";n.author=val("fPerson")||n.author;}}
if(t==="eventEdit"){const e=db.events.find(x=>x.id===state.modal.editId);if(e){const owner=val("fCalendar")||"family";e.title=title;e.date=val("fDate");e.time=val("fTime");e.calendarOwner=owner;e.person=calendarName(owner)==="Familie"?"Alle":calendarName(owner);e.place=val("fPlace");e.remindMinutes=Number(val("fReminder")||0);e.note=val("fNote");}}
if(t==="taskEdit"){const x=db.tasks.find(x=>x.id===state.modal.editId);if(x){x.title=title;x.due=val("fDate");x.time=val("fTime");x.who=val("fPerson");x.prio=val("fPrio");x.repeat=val("fRepeat");x.remindMinutes=Number(val("fReminder")||0);x.note=val("fNote");}}
if(t==="shopEdit"){const s=db.shopping.find(x=>x.id===state.modal.editId);if(s){s.name=title;s.listId=val("fList");s.qty=val("fQty");s.cat=val("fCat")||"Sonstiges";s.by=val("fPerson");s.note=val("fNote");}}
if(t==="person")db.family.push({id,name:title,role:val("fRole"),photo:"",tone:["#b56e52","#6f87a7","#718c70","#b98b56","#9b78a6"][db.family.length%5]});if(t==="meal"){const ingredients=val("fIngredients").split(/[\n,]/).map(x=>x.trim()).filter(Boolean);db.meals.push({id,day:val("fDay"),title,ingredients});}
if(t==="inbox")db.inbox.unshift({id:"i"+Date.now(),text:title,author:currentDisplayName(),created:new Date().toISOString()});
if(t==="maintenance"){if(!requireParent())return;db.houseMaintenance.push({id:"hm"+Date.now(),title,area:val("fArea")||"Haus",nextDate:val("fDate"),intervalMonths:Number(val("fInterval")||12),reminderDays:Number(val("fReminderDays")||0),responsible:val("fPerson"),note:val("fNote"),lastDone:""});}
if(t==="asset"){if(!requireParent())return;db.houseAssets.push({id:"ha"+Date.now(),name:title,location:val("fArea")||"Haus",purchaseDate:val("fPurchase"),warrantyUntil:val("fWarranty"),serial:val("fSerial"),note:val("fNote")});}
if(t==="meter"){if(!requireParent())return;db.meterReadings.push({id:"mr"+Date.now(),kind:val("fKind"),value:title,unit:val("fUnit")||"",date:val("fDate")||todayISO()});}
if(t==="event")addActivity("📅",`hat den Termin „${title}“ erstellt.`,"event",id);
if(t==="task")addActivity("✓",`hat die Aufgabe „${title}“ erstellt.`,"task",id);
if(t==="shop")addActivity("🛒",`hat „${title}“ zur Einkaufsliste hinzugefügt.`,"shop",id);
if(t==="note")addActivity("📌",`hat „${title}“ an die Pinnwand geschrieben.`,"note",id);
if(t==="meal")addActivity("🍲",`hat „${title}“ in den Essensplan eingetragen.`,"meal",id);
if(t==="inbox")addActivity("📥","hat etwas in die Familien-Inbox gelegt.","inbox",id);
if(t==="eventEdit")addActivity("✏️",`hat den Termin „${title}“ bearbeitet.`,"event",state.modal.editId);
if(t==="taskEdit")addActivity("✏️",`hat die Aufgabe „${title}“ bearbeitet.`,"task",state.modal.editId);
if(t==="shopEdit")addActivity("✏️",`hat den Einkaufsartikel „${title}“ bearbeitet.`,"shop",state.modal.editId);
if(t==="noteEdit")addActivity("✏️",`hat „${val("fTitle")}“ auf der Pinnwand bearbeitet.`,"note",state.modal.editId);
save();state.modal=null;render()}
let photoPersonId=null;
function editPhoto(id){if(!requireParent())return;photoPersonId=id;document.getElementById("photoPicker").click()}
function savePhoto(ev){
 const file=ev.target.files[0];if(!file||!requireParent())return;
 const reader=new FileReader();
 reader.onload=()=>{const img=new Image();img.onload=()=>{const size=256,canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;const ctx=canvas.getContext("2d"),scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);const p=db.family.find(x=>x.id===photoPersonId);if(p){p.photo=canvas.toDataURL("image/jpeg",.78);save();render()}};img.src=reader.result};reader.readAsDataURL(file)
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download("FamilienHub-Backup.json",JSON.stringify(db,null,2),"application/json")}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert("Backup importiert.")}catch{alert("Ungültige Backup-Datei.")}};r.readAsText(f)}
function exportICS(){let txt="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FamilienHub//DE\r\n";for(const e of db.events){const dt=e.date.replaceAll("-","")+ "T"+e.time.replace(":","")+"00";txt+=`BEGIN:VEVENT\r\nUID:${e.id}@familienhub\r\nDTSTART:${dt}\r\nSUMMARY:${e.title.replaceAll("\n"," ")}\r\nDESCRIPTION:Kalender: ${calendarName(e.calendarOwner)}\r\nLOCATION:${(e.place||"").replaceAll("\n"," ")}\r\nEND:VEVENT\r\n`}txt+="END:VCALENDAR\r\n";download("FamilienHub-Kalender.ics",txt,"text/calendar")}
function resetDemo(){if(confirm("Alle lokalen Daten zurücksetzen?")){localStorage.removeItem(KEY);db=structuredClone(seed);render()}}
async function enableNotifications(){if(!("Notification"in window)){alert("Benachrichtigungen werden von diesem Browser nicht unterstützt.");return}const p=await Notification.requestPermission();db.settings.notifications=p==="granted";save();if(p==="granted")new Notification("FamilienHub",{body:"Erinnerungen sind aktiviert."});render()}
function checkReminders(){
 if(!db.settings.notifications||!("Notification"in window)||Notification.permission!=="granted")return;
 const now=new Date();
 for(const r of reminderItems()){
   const age=now-r.trigger;
   if(age<0||age>7*86400000)continue;
   const key="fh-notified-"+r.key;
   if(localStorage.getItem(key))continue;
   new Notification(`${r.icon} ${r.type}: ${r.title}`,{
     body:`${r.meta} · ${reminderDateText(r.due)}`
   });
   localStorage.setItem(key,new Date().toISOString());
 }
}
async function connectHA(){if(!requireParent())return;const url=document.getElementById("haUrl").value.trim().replace(/\/$/,""),token=document.getElementById("haToken").value.trim();if(!url||!token)return;const box=document.getElementById("haStatus");box.textContent="Verbinde…";try{const r=await fetch(url+"/api/states",{headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);const all=await r.json();const ents=all.filter(x=>["light.","switch.","cover."].some(p=>x.entity_id.startsWith(p))).slice(0,30).map(x=>({entity_id:x.entity_id,name:x.attributes.friendly_name||x.entity_id,room:"Home Assistant",icon:x.entity_id.startsWith("cover.")?"🪟":"💡",state:x.state}));db.ha={url,token,connected:true,entities:ents};save();render()}catch(e){box.textContent="Verbindung fehlgeschlagen: "+e.message}}
function disconnectHA(){if(!requireParent())return;db.ha.connected=false;db.ha.entities=[];save();render()}
async function haToggle(entity,stateNow){if(!requireGeneralEdit()||!db.ha.connected)return;const domain=entity.split(".")[0];let service;if(domain==="cover")service=(stateNow==="open"?"close_cover":"open_cover");else service=(stateNow==="on"?"turn_off":"turn_on");try{await fetch(`${db.ha.url}/api/services/${domain}/${service}`,{method:"POST",headers:{Authorization:"Bearer "+db.ha.token,"Content-Type":"application/json"},body:JSON.stringify({entity_id:entity})});setTimeout(connectHARefresh,500)}catch(e){alert("Schalten fehlgeschlagen: "+e.message)}}
async function connectHARefresh(){try{const r=await fetch(db.ha.url+"/api/states",{headers:{Authorization:"Bearer "+db.ha.token}});const all=await r.json();db.ha.entities=db.ha.entities.map(e=>{const n=all.find(x=>x.entity_id===e.entity_id);return n?{...e,state:n.state}:e});save();render()}catch{}}

if("serviceWorker" in navigator){
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      reg.addEventListener("updatefound",()=>console.log("FamilienHub Update gefunden."));
    }catch(e){console.warn("Service Worker:",e)}
  });
}

window.state=state;
const recoveryDetected=detectPasswordRecovery();
if(!recoveryDetected&&cloud.enabled&&cloud.accessToken){bootstrapCloud()}
render();
